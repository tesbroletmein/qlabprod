<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>질문 연구소</title>
<script>
/* 화면이 그려지기 전에 저장된 테마를 먼저 적용합니다 (새로고침 시 깜빡임 방지). */
(function(){
  try{
    var saved = localStorage.getItem('qlab.theme');
    if(!saved){
      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', saved);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
/* =========================================================
   0. Design Tokens
========================================================= */
:root{
  --c-primary:#4954E6;
  --c-primary-600:#3A44C7;
  --c-primary-50:#EEF0FE;
  --c-bg:#F6F7FB;
  --c-surface:#FFFFFF;
  --c-border:#E4E6EF;
  --c-border-strong:#D3D6E4;
  --c-text:#1B1E2B;
  --c-text-2:#6B7280;
  --c-text-3:#9CA3AF;

  --c-success:#178A4C; --c-success-bg:#E7F7EE;
  --c-warning:#B5690A; --c-warning-bg:#FDF1E1;
  --c-danger:#C6323A;  --c-danger-bg:#FBE9EA;
  --c-info:#1D6FE0;    --c-info-bg:#E8F1FD;
  --c-neutral:#5B6072;  --c-neutral-bg:#EEEFF3;

  --radius-sm:8px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-pill:999px;

  --shadow-card:0 1px 2px rgba(20,22,40,.04), 0 1px 8px rgba(20,22,40,.04);
  --shadow-modal:0 12px 40px rgba(20,22,40,.18);

  --fs-display:1.5rem;    /* 24px */
  --fs-title:1.125rem;    /* 18px */
  --fs-subtitle:1rem;     /* 16px */
  --fs-body:0.9375rem;    /* 15px */
  --fs-caption:0.8125rem; /* 13px */
  --fs-micro:0.6875rem;   /* 11px */

  --nav-h:64px;
  --topbar-h:56px;

  /* 밝은 화면 전용 값 (다크 모드에서 아래 [data-theme="dark"] 가 덮어씁니다) */
  --c-primary-100:#E2E5FD;
  --c-primary-disabled:#C7CBF5;
  --c-on-primary:#FFFFFF;
  --c-danger-bg-2:#F7D9DB;
  --c-skel-a:#EEF0F5;
  --c-skel-b:#F6F7FB;
  --c-toast-bg:#1B1E2B;
  --c-toast-fg:#FFFFFF;
  color-scheme:light;
}

/* =========================================================
   다크 모드 — 설정에서 켜면 <html data-theme="dark"> 가 붙습니다.
========================================================= */
:root[data-theme="dark"]{
  --c-primary:#7B85FF;
  --c-primary-600:#98A0FF;
  --c-primary-50:#212643;
  --c-primary-100:#2B3155;
  --c-primary-disabled:#3A3F63;
  --c-on-primary:#12141C;

  --c-bg:#0F1117;
  --c-surface:#171A23;
  --c-border:#272B38;
  --c-border-strong:#3B4256;
  --c-text:#E8EAF2;
  --c-text-2:#A3A9BC;
  --c-text-3:#767D91;

  --c-success:#5BD98D; --c-success-bg:#123322;
  --c-warning:#F0B457; --c-warning-bg:#332714;
  --c-danger:#F98A90;  --c-danger-bg:#3A1C20;  --c-danger-bg-2:#4C2429;
  --c-info:#79B4FF;    --c-info-bg:#152A42;
  --c-neutral:#AEB4C6; --c-neutral-bg:#232733;

  --c-skel-a:#1E2230;
  --c-skel-b:#262B3B;
  --c-toast-bg:#E8EAF2;
  --c-toast-fg:#12141C;

  --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 1px 8px rgba(0,0,0,.28);
  --shadow-modal:0 12px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-theme="dark"] .overlay{background:rgba(0,0,0,.62);}
:root[data-theme="dark"] .toggle::after{background:#F2F4FA;}
/* 부드럽게 전환 */
body, .card, .list-item, .topbar, .side-nav, .bottom-nav, .sheet,
.input, .textarea, select.input, .chip, .tabs, .table-scroll, .qcloud{
  transition:background-color .18s ease, border-color .18s ease, color .18s ease;
}
@media (prefers-reduced-motion:reduce){
  body, .card, .list-item, .topbar, .side-nav, .bottom-nav, .sheet,
  .input, .textarea, select.input, .chip, .tabs, .table-scroll, .qcloud{transition:none;}
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--c-bg);
  color:var(--c-text);
  -webkit-font-smoothing:antialiased;
  font-size:var(--fs-body);
  line-height:1.5;
}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;}
svg{width:1em; height:1em; vertical-align:-0.125em; flex-shrink:0;}
:focus-visible{outline:2px solid var(--c-primary); outline-offset:2px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--c-border-strong);border-radius:99px;}

.t-display{font-size:var(--fs-display); font-weight:700; letter-spacing:-.01em; line-height:1.35;}
.t-title{font-size:var(--fs-title); font-weight:600; letter-spacing:-.01em; line-height:1.4;}
.t-subtitle{font-size:var(--fs-subtitle); font-weight:600; line-height:1.4;}
.t-body{font-size:var(--fs-body); font-weight:400; color:var(--c-text);}
.t-body-md{font-size:var(--fs-body); font-weight:500; color:var(--c-text);}
.t-caption{font-size:var(--fs-caption); font-weight:400; color:var(--c-text-2);}
.t-micro{font-size:var(--fs-micro); font-weight:500; color:var(--c-text-3); text-transform:uppercase; letter-spacing:.04em;}

#app{min-height:100%;}
.shell{display:flex; flex-direction:column; min-height:100vh;}
.topbar{
  height:var(--topbar-h); flex:0 0 auto;
  display:flex; align-items:center; gap:4px;
  padding:0 16px; background:var(--c-surface);
  border-bottom:1px solid var(--c-border);
  position:sticky; top:0; z-index:20;
}
.topbar .tb-back{
  width:32px;height:32px;border-radius:var(--radius-pill);border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c-text-2);
}
.topbar .tb-back:hover{background:var(--c-neutral-bg);}
.topbar .tb-title{font-size:var(--fs-title); font-weight:700; flex:1; min-width:0; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .tb-action{
  width:36px;height:36px;border-radius:var(--radius-pill);border:none;background:transparent;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c-text-2);
}
.topbar .tb-action:hover{background:var(--c-neutral-bg);}
.topbar .tb-action svg,.topbar .tb-back svg{width:18px;height:18px;}

.main{flex:1 1 auto; padding:16px 16px calc(var(--nav-h) + 24px); max-width:720px; width:100%; margin:0 auto;}
.main.no-nav{padding-bottom:24px;}

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; height:var(--nav-h);
  background:var(--c-surface); border-top:1px solid var(--c-border);
  display:flex; z-index:30; overflow-x:auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav button{
  flex:1 0 auto; min-width:56px; border:none; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; color:var(--c-text-3); cursor:pointer; font-size:10px; font-weight:600; padding:6px 4px;
}
.bottom-nav button.active{color:var(--c-primary);}
.bottom-nav svg{width:19px;height:19px;}
/* 아주 좁은 화면(아이폰 SE 등)에서도 탭이 모두 보이도록 살짝 줄인다 */
@media (max-width:380px){
  .bottom-nav button{min-width:48px; font-size:9px; padding:6px 2px; gap:1px;}
  .bottom-nav svg{width:18px;height:18px;}
}

.side-nav{display:none;}

@media (min-width:900px){
  .shell{flex-direction:row;}
  .side-nav{
    display:flex; flex-direction:column; width:232px; flex:0 0 232px;
    background:var(--c-surface); border-right:1px solid var(--c-border);
    padding:20px 12px; gap:4px; height:100vh; position:sticky; top:0;
  }
  .side-nav .sn-brand{font-size:var(--fs-title); font-weight:800; color:var(--c-primary); padding:8px 12px 20px;}
  .side-nav .sn-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-md);
    color:var(--c-text-2); font-weight:600; font-size:var(--fs-body); cursor:pointer; border:none; background:none; text-align:left;
  }
  .side-nav .sn-item svg{width:18px;height:18px;flex:0 0 auto;}
  .side-nav .sn-item.active{background:var(--c-primary-50); color:var(--c-primary);}
  .side-nav .sn-item:hover:not(.active){background:var(--c-neutral-bg);}
  .bottom-nav{display:none;}
  .content-col{flex:1 1 auto; display:flex; flex-direction:column; min-height:100vh;}
  .main{padding:28px 32px 40px; max-width:880px;}
  .topbar{padding:0 32px;}
}
@media (min-width:1200px){
  .main{max-width:960px;}
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:48px; padding:0 18px; border-radius:var(--radius-md); border:none;
  font-size:var(--fs-body); font-weight:600; cursor:pointer; transition:.15s background,.15s transform;
  white-space:nowrap;
}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.6; cursor:not-allowed;}
.btn-block{width:100%;}
.btn-sm{height:36px;padding:0 14px;font-size:var(--fs-caption);border-radius:var(--radius-sm);}
.btn-primary{background:var(--c-primary); color:var(--c-on-primary);}
.btn-primary:hover{background:var(--c-primary-600);}
.btn-primary:disabled{background:var(--c-primary-disabled); cursor:not-allowed;}
.btn-secondary{background:var(--c-primary-50); color:var(--c-primary);}
.btn-secondary:hover{background:var(--c-primary-100);}
.btn-outline{background:var(--c-surface); color:var(--c-text); border:1px solid var(--c-border-strong);}
.btn-outline:hover{background:var(--c-neutral-bg);}
.btn-text{background:none; color:var(--c-primary); height:auto; padding:4px 2px;}
.btn-danger{background:var(--c-danger-bg); color:var(--c-danger);}
.btn-danger:hover{background:var(--c-danger-bg-2);}
.btn-icon{width:40px;height:40px;padding:0;border-radius:var(--radius-pill);background:var(--c-neutral-bg);color:var(--c-text-2); border:none; cursor:pointer;}
.btn-icon svg{width:18px;height:18px;}

.card{
  background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius-lg);
  padding:16px; box-shadow:var(--shadow-card);
}
.card + .card{margin-top:12px;}
.stack > * + *{margin-top:12px;}
.list-item{
  display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--c-surface);
  border:1px solid var(--c-border); border-radius:var(--radius-lg); cursor:pointer;
}
.list-item:hover{border-color:var(--c-border-strong);}
.list-item + .list-item{margin-top:10px;}
.thumb{
  width:52px;height:52px;border-radius:var(--radius-md);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;
}
.thumb svg{width:22px;height:22px;}
.landing-logo svg{width:28px;height:28px;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:var(--fs-caption); font-weight:600; color:var(--c-text-2); margin-bottom:6px;}
.input, .textarea, select.input{
  width:100%; height:48px; border-radius:var(--radius-md); border:1px solid var(--c-border-strong);
  padding:0 14px; font-size:var(--fs-body); background:var(--c-surface); color:var(--c-text);
}
.input:focus, .textarea:focus{border-color:var(--c-primary); box-shadow:0 0 0 3px var(--c-primary-50); outline:none;}
.textarea{height:auto; padding:12px 14px; min-height:96px; resize:vertical; line-height:1.5;}
.field-hint{font-size:var(--fs-caption); color:var(--c-text-3); margin-top:6px;}
.field-error{font-size:var(--fs-caption); color:var(--c-danger); margin-top:6px; display:flex; align-items:center; gap:4px;}
.input.err{border-color:var(--c-danger);}

.badge{
  display:inline-flex; align-items:center; gap:4px; padding:4px 9px; border-radius:var(--radius-pill);
  font-size:var(--fs-micro); font-weight:700;
}
.badge svg{width:11px;height:11px;}
.badge-pending{background:var(--c-warning-bg); color:var(--c-warning);}
.badge-approved{background:var(--c-success-bg); color:var(--c-success);}
.badge-rejected{background:var(--c-danger-bg); color:var(--c-danger);}
.badge-active{background:var(--c-info-bg); color:var(--c-info);}
.badge-closed{background:var(--c-neutral-bg); color:var(--c-neutral);}

.tabs{display:flex; gap:4px; background:var(--c-neutral-bg); padding:4px; border-radius:var(--radius-md); margin-bottom:16px;}
.tabs button{
  flex:1; border:none; background:none; padding:9px 8px; border-radius:var(--radius-sm);
  font-size:var(--fs-caption); font-weight:700; color:var(--c-text-2); cursor:pointer;
}
.tabs button.active{background:var(--c-surface); color:var(--c-primary); box-shadow:var(--shadow-card);}

.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
.chip{
  flex:0 0 auto; padding:8px 14px; border-radius:var(--radius-pill); border:1px solid var(--c-border-strong);
  background:var(--c-surface); font-size:var(--fs-caption); font-weight:600; color:var(--c-text-2); cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--c-primary); color:#fff; border-color:var(--c-primary);}

.toggle{position:relative; width:44px; height:26px; border-radius:99px; background:var(--c-border-strong); border:none; cursor:pointer; flex:0 0 auto;}
.toggle::after{content:'';position:absolute; top:3px;left:3px; width:20px;height:20px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on{background:var(--c-primary);}
.toggle.on::after{left:21px;}

.overlay{position:fixed; inset:0; background:rgba(20,22,35,.44); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.overlay.center{align-items:center; padding:20px;}
.sheet{
  background:var(--c-surface); width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:8px 20px 24px;
  max-height:86vh; overflow-y:auto; animation:sheetUp .18s ease-out;
}
.overlay.center .sheet{border-radius:var(--radius-lg); max-width:420px;}
@keyframes sheetUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--c-border-strong); border-radius:99px; margin:6px auto 14px;}
.sheet-title{font-size:var(--fs-title); font-weight:700; margin-bottom:4px;}
@media (min-width:900px){
  .overlay{align-items:center;}
  .sheet{border-radius:var(--radius-lg); max-width:460px;}
}

.state-block{display:flex; flex-direction:column; align-items:center; text-align:center; padding:48px 20px; color:var(--c-text-2);}
.state-block .state-icon{width:52px;height:52px; margin-bottom:14px; color:var(--c-text-3);}
.state-block .state-icon svg{width:52px;height:52px;}
.state-block .state-title{font-size:var(--fs-subtitle); font-weight:700; color:var(--c-text); margin-bottom:6px;}
.state-block .state-desc{font-size:var(--fs-caption); color:var(--c-text-2); margin-bottom:16px; max-width:280px;}
.state-block.error .state-icon{color:var(--c-danger);}

.skeleton{background:linear-gradient(90deg,var(--c-skel-a) 25%,var(--c-skel-b) 37%,var(--c-skel-a) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius-md);}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.sk-row{height:64px;margin-bottom:10px;}

.stepper{display:flex; align-items:center; gap:6px; margin-bottom:20px;}
.stepper .dot{flex:1; height:5px; border-radius:99px; background:var(--c-border);}
.stepper .dot.done{background:var(--c-primary);}
.stepper .dot.now{background:var(--c-primary); opacity:.5;}

/* --- 홈 화면 상단 띠 / 하단 문구 --- */
/* 홈 화면 우상단 표시 */
.landing-credit{
  position:fixed; z-index:60;
  top:calc(16px + env(safe-area-inset-top, 0px)); right:20px;
  font-size:var(--fs-caption); color:var(--c-text-3);
  white-space:nowrap; pointer-events:none;
}
@media (max-width:360px){
  .landing-credit{right:14px; font-size:12px;}
}

/* --- 질문 구름 (실시간 질문 모음)
   · 여러 번 나온 질문이라도 글씨 크기는 서로 비슷하게 둡니다.
   · 자리는 무작위로 흩어 놓되, 서로 겹치지는 않게 합니다.            --- */
.qcloud{
  position:relative; width:100%; min-height:220px;
  overflow:hidden; border-radius:var(--radius-md); background:var(--c-surface);
}
.qcloud .qc-layer{position:absolute; inset:0;}
.qcloud .qc-item{
  position:absolute; left:0; top:0; box-sizing:border-box;
  padding:9px 12px; border-radius:14px; border:1px solid;
  font-size:14px; font-weight:600; line-height:1.45; letter-spacing:-.01em;
  word-break:keep-all; overflow-wrap:anywhere;
  transform:rotate(var(--rot,0deg));
  animation:qcPop .3s ease-out both;
}
.qcloud .qc-count{margin-left:6px; font-size:11px; font-weight:800; opacity:.7;}
@keyframes qcPop{from{opacity:0;} to{opacity:1;}}
.qcloud .qc-empty{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:var(--fs-caption); color:var(--c-text-3);
}
@media (prefers-reduced-motion:reduce){ .qcloud .qc-item{animation:none;} }

.reaction-btn{
  display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border-radius:var(--radius-pill);
  border:1px solid var(--c-border-strong); background:var(--c-surface); font-size:12px; font-weight:700; color:var(--c-text-2); cursor:pointer;
}
.reaction-btn.on{background:var(--c-primary-50); border-color:var(--c-primary); color:var(--c-primary);}

.toast-wrap{position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + 16px); display:flex; justify-content:center; z-index:200; pointer-events:none;}
.toast{background:var(--c-toast-bg); color:var(--c-toast-fg); padding:12px 18px; border-radius:var(--radius-pill); font-size:var(--fs-caption); font-weight:600; box-shadow:var(--shadow-modal); animation:toastIn .18s ease-out;}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.avatar{width:40px;height:40px;border-radius:50%;background:var(--c-primary-50); color:var(--c-primary); display:flex;align-items:center;justify-content:center; font-weight:700; flex:0 0 auto;}

.divider{height:1px; background:var(--c-border); margin:16px 0;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}

table.datatable{width:100%; border-collapse:collapse; font-size:var(--fs-caption);}
table.datatable th{text-align:left; color:var(--c-text-2); font-weight:600; padding:10px 8px; border-bottom:1px solid var(--c-border); white-space:nowrap;}
table.datatable td{padding:10px 8px; border-bottom:1px solid var(--c-border); vertical-align:middle;}
.table-scroll{overflow-x:auto; border:1px solid var(--c-border); border-radius:var(--radius-lg); background:var(--c-surface);}

.cta-fixed{position:sticky; bottom:0; background:linear-gradient(to top, var(--c-bg) 60%, transparent); padding:16px 0 4px; margin-top:8px;}

.chat-scroll{display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px; min-height:200px; max-height:52vh; overflow-y:auto;}
.msg{max-width:80%; padding:10px 14px; border-radius:14px; font-size:var(--fs-body); line-height:1.55; word-break:break-word; white-space:pre-line;}
.msg.user{align-self:flex-end; background:var(--c-primary); color:#fff; border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start; background:var(--c-surface); border:1px solid var(--c-border); border-bottom-left-radius:4px;}
.chat-input-bar{position:sticky; bottom:0; background:var(--c-bg); padding-top:10px; display:flex; gap:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>

// 유튜브 주소에서 영상 id 를 뽑아냅니다. (youtu.be, /watch?v=, /shorts/, /embed/)
function youtubeId(url){
  if(!url) return '';
  const m = String(url).match(
    /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}
function vimeoId(url){
  const m = String(url||'').match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : '';
}
// 앱 안에서 재생할 수 있는 주소인지
function embedSrc(url){
  const y = youtubeId(url);
  if(y) return `https://www.youtube-nocookie.com/embed/${y}?rel=0&modestbranding=1`;
  const v = vimeoId(url);
  if(v) return `https://player.vimeo.com/video/${v}`;
  return '';
}
// 링크는 언제나 함께 보여 줍니다.
//   퍼가기를 막아 둔 영상이나 학교에서 막힌 사이트일 때 빠져나갈 길이 됩니다.
function materialLinkHTML(link, label){
  if(!link) return '';
  return `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer"
    style="display:flex; align-items:center; gap:10px; padding:12px 14px; margin-bottom:16px; border:1px solid var(--c-border); border-radius:var(--radius-md); text-decoration:none; color:var(--c-primary); background:var(--c-primary-50);">
    <span style="font-size:18px;">${Icon.link}</span>
    <span style="flex:1; min-width:0;">
      <span class="t-body-md" style="display:block; color:var(--c-primary);">${esc(label||'원래 자료 열기')}</span>
      <span class="t-caption" style="display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(link)}</span>
    </span>
  </a>`;
}
function materialMediaHTML(m){
  let out = '';
  // ① 이미지가 붙어 있으면 보여 줍니다.
  if(m.src){
    out += `<img src="${esc(m.src)}" alt="${esc(m.title)}" style="width:100%; border-radius:var(--radius-md); margin-bottom:16px; display:block;">`;
  }
  // ② 유튜브·비메오 주소면 화면 안에서 바로 재생합니다.
  const src = embedSrc(m.link);
  if(src){
    out += `<div style="position:relative; width:100%; padding-top:56.25%; margin-bottom:10px; border-radius:var(--radius-md); overflow:hidden; background:#000;">
      <iframe src="${esc(src)}" title="${esc(m.title)}" loading="lazy"
        style="position:absolute; inset:0; width:100%; height:100%; border:0;"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>`;
    out += materialLinkHTML(m.link, '유튜브에서 열기');
  } else {
    // ③ 그 밖의 주소는 새 창으로 엽니다.
    //    (신문사처럼 대부분의 사이트는 다른 화면 안에 끼워 넣는 것을 막아 둡니다)
    out += materialLinkHTML(m.link);
  }
  return out;
}

function numberOf(nickname, dataset){
  const d = dataset || (state.tSessionId ? tData() : sData());
  const s = d && d.students ? d.students.find(x=>x.nickname===nickname) : null;
  return s ? s.number : null;
}
function nameWithNumber(nickname, dataset){
  const nick = nickname || '(미설정)';
  const num = numberOf(nickname, dataset);
  return num ? `${nick} (${num})` : nick;
}
function askedCount(q){ return q.by ? q.by.length : (q.n||0); }
function totalAskedCount(list){ return list.reduce((a,q)=>a+askedCount(q),0); }

/* =========================================================
   질문 구름 — [브레인스토밍] 의 '실시간 질문 모음'
   · 여러 번 나온 질문이라도 글씨 크기는 서로 비슷하게 둡니다.
     (많이 나온 것을 가운데에 크게 두던 예전 워드클라우드와 다른 점입니다)
   · 자리는 무작위로 흩어 놓되, 서로 겹치지는 않게 잡습니다.
   · 화면을 다시 그릴 때마다 자리가 튀지 않도록, 무작위 값은
     '질문 글자'에서 뽑아 씁니다. 같은 질문이면 늘 같은 자리예요.
========================================================= */
const QUESTION_MAX = 120;          // 질문 하나의 최대 글자 수

/* ---------- '질문 더하기' 한 줄 다루기 ----------
   예전 파일에는 글자만 저장돼 있어서, 글자가 오면 '공개' 로 봅니다. */
function extraText(x){ return typeof x === 'string' ? x : ((x && x.text) || ''); }
function extraPrivate(x){ return typeof x === 'string' ? false : !!(x && x.private); }
function extraItem(text, priv){ return { text: text, private: !!priv }; }
// 저장돼 있던 값을 언제나 같은 모양으로 맞춰 줍니다.
function normalizeExtras(list){
  return (list||[]).map(x=>extraItem(extraText(x), extraPrivate(x))).filter(x=>x.text);
}

// 글자에서 뽑아내는 고정된 숫자 (같은 글자면 언제나 같은 값)
function qcHash(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function qcRand(seed, k){
  const x = Math.sin((seed % 100000) * (k+1) * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
function questionCloudHTML(list){
  if(!list || !list.length){
    return `<div class="qcloud"><div class="qc-empty">아직 등록된 질문이 없어요.</div></div>`;
  }
  const id = 'qc-' + (++QC_SEQ);
  QC_STORE[id] = list;
  return `<div class="qcloud" id="${id}"><div class="qc-layer"></div></div>`;
}
function drawQuestionCloud(box){
  const list = QC_STORE[box.id];
  const layer = box.querySelector('.qc-layer');
  if(!list || !list.length || !layer) return;

  const W = box.clientWidth || 320;
  if(W < 60) return;
  const GAP  = 12;
  const cols = Math.max(1, Math.min(4, Math.floor((W + GAP) / 250)));
  const colW = Math.floor((W - GAP*(cols+1)) / cols);

  // 순서도 무작위로 섞습니다. (글자에서 뽑은 값으로 섞으므로 다시 그려도 순서가 같아요)
  const items = list.map((q, i) => ({ q, seed: qcHash(q.t) + i }))
                    .sort((a, b) => qcRand(a.seed, 1) - qcRand(b.seed, 1));

  const pal = qcPalette();
  layer.innerHTML = items.map(({q, seed}, i)=>{
    const c = pal[qcHash(q.t) % pal.length];
    const n = askedCount(q);
    const rot = (qcRand(seed, 2)*2 - 1) * 1.8;                              // -1.8˚ ~ +1.8˚
    const w = Math.max(120, Math.round(colW * (0.84 + qcRand(seed, 3)*0.16)));
    return `<span class="qc-item" data-seed="${seed}"`
      + ` style="width:${w}px; --rot:${rot.toFixed(2)}deg;`
      + ` background:${c[0]}; color:${c[1]}; border-color:${c[2]};`
      + ` animation-delay:${Math.min(i*25, 450)}ms;"`
      + ` title="${esc(q.t)}${n>1?` · ${n}번 나왔어요`:''}">${esc(q.t)}`
      + `${n>1?`<span class="qc-count">×${n}</span>`:''}</span>`;
  }).join('');

  // 세로로 가장 여유 있는 칸에 차례로 넣고, 좌우·위아래로 조금씩 흔들어 놓습니다.
  const colY = Array.from({length:cols}, ()=>GAP);
  [...layer.children].forEach(el=>{
    const seed = Number(el.dataset.seed) || 0;
    let c = 0;
    for(let k=1;k<cols;k++) if(colY[k] < colY[c]) c = k;
    const h = el.offsetHeight;
    const room = Math.max(0, colW - el.offsetWidth);
    const x = GAP + c*(colW+GAP) + Math.round(qcRand(seed, 4) * room);
    const y = colY[c] + Math.round(qcRand(seed, 5) * 10);
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    colY[c] = y + h + GAP;
  });
  box.style.height = Math.max(220, Math.max(...colY) + 4) + 'px';
}

/* =========================================================
   저장소 정리
     자료를 지우거나 이미지를 바꾸는 중에 인터넷이 끊기면,
     아무 자료도 쓰지 않는 파일이 저장소에 남을 수 있습니다.
     그런 파일을 찾아 지웁니다. 지금 쓰이는 이미지는 절대 건드리지 않습니다.
========================================================= */
function fmtBytes(n){
  if(!n) return '0 KB';
  if(n < 1024*1024) return `${Math.max(1, Math.round(n/1024))} KB`;
  return `${(n/1024/1024).toFixed(1)} MB`;
}
function storageCleanupCard(){
  const st = state.cleanupState;
  const list = state.cleanupList || [];
  const total = list.reduce((a,b)=>a+(b.size||0), 0);

  let body;
  if(st === 'scanning'){
    body = `<div class="t-caption" style="color:var(--c-text-3); padding:8px 0;">저장소를 살펴보는 중이에요...</div>`;
  } else if(st === 'clean'){
    body = `
      <div class="t-caption" style="color:var(--c-success); padding:8px 0;">${Icon.check} 지울 파일이 없어요. 저장소가 깨끗합니다.</div>
      <button class="btn btn-outline btn-block" onclick="scanOrphanFiles()">다시 검사하기</button>`;
  } else if(st === 'done' && list.length){
    body = `
      <div class="card" style="background:var(--c-warning-bg); border:1px solid var(--c-warning); padding:12px; margin-bottom:10px;">
        <div class="t-body-md" style="color:var(--c-warning);">안 쓰는 파일 ${list.length}개 · ${fmtBytes(total)}</div>
        <div class="t-caption" style="margin-top:4px;">어느 자료에도 붙어 있지 않은 파일이에요. 지워도 수업 자료에는 아무 영향이 없어요.</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline btn-block" onclick="scanOrphanFiles()">다시 검사</button>
        <button class="btn btn-danger btn-block" onclick="confirmCleanupStorage()">${list.length}개 지우기</button>
      </div>`;
  } else {
    body = `
      ${state.cleanupFreed ? `<div class="t-caption" style="color:var(--c-success); margin-bottom:10px;">${Icon.check} 지난번에 ${fmtBytes(state.cleanupFreed)} 를 비웠어요.</div>` : ''}
      <button class="btn btn-outline btn-block" onclick="scanOrphanFiles()">안 쓰는 파일 검사하기</button>`;
  }

  return `
  <div class="card" style="margin-top:14px;">
    <div class="t-body-md" style="margin-bottom:4px;">🧹 저장소 정리</div>
    <p class="t-caption" style="margin-bottom:12px;">이미지를 바꾸거나 자료를 지우다가 인터넷이 끊기면,
      아무도 쓰지 않는 파일이 남을 수 있어요. 지금 쓰이는 이미지는 건드리지 않아요.
      <b>이 학급의 파일만</b> 살펴봅니다.</p>
    ${body}
  </div>`;
}

/* ---------- 별명 규칙 ----------
   한글(가~힣)만, 6글자 이내로 정합니다.
   서버(auth-gateway)의 checkNickname 과 같은 규칙이며, 서버에서도 한 번 더 검사합니다.
--------------------------------- */
const NICK_MAX = 6;
function nickProblem(v){
  const s = (v||'').trim();
  if(!s) return '별명을 입력해주세요.';
  if(/[\u3131-\u318E]/.test(s)) return '자음·모음만 있는 글자는 쓸 수 없어요. (예: ㅋㅋ, ㅏ)';
  if(!/^[\uAC00-\uD7A3]+$/.test(s)) return '별명은 한글로만 지어주세요. (영어·숫자·기호·공백은 쓸 수 없어요)';
  if([...s].length > NICK_MAX) return `별명은 한글 ${NICK_MAX}글자 이내로 지어주세요.`;
  return null;
}
// 입력하는 동안 바로 알려줍니다.
function checkNickHint(el, hintId){
  const hint = $('#'+hintId);
  if(!hint) return;
  const v = el.value.trim();
  if(!v){
    hint.textContent = `한글 ${NICK_MAX}글자 이내로 지어주세요.`;
    hint.style.color = ''; el.classList.remove('err'); return;
  }
  const p = nickProblem(v);
  hint.textContent = p || `쓸 수 있는 별명이에요. (${[...v].length} / ${NICK_MAX}글자)`;
  hint.style.color = p ? 'var(--c-danger)' : 'var(--c-success)';
  el.classList.toggle('err', !!p);
}

// 서버(auth-gateway)의 checkPin 과 같은 규칙입니다.
// 서버에서도 한 번 더 검사하므로, 이건 학생에게 미리 알려주기 위한 것입니다.
/* ---------- 고유 번호 ----------
   선생님이 학생마다 나눠주는 번호입니다. 예전에는 학번(숫자 7자리)만 됐지만,
   이제 영문과 숫자를 섞어 쓸 수 있습니다. (예: A1B2C3, 2620101, CLASS3-07 은 불가)
   대소문자는 구별하지 않습니다. 입력한 것을 모두 대문자로 바꿔 저장합니다.
--------------------------------- */
const SNO_MIN = 4, SNO_MAX = 12;
function normSno(v){ return String(v||'').trim().toUpperCase().replace(/\s+/g,''); }
function snoProblem(v){
  const t = normSno(v);
  if(!t) return '고유 번호를 입력해주세요.';
  if(!/^[A-Z0-9]+$/.test(t)) return '고유 번호는 영문과 숫자만 쓸 수 있어요.';
  if(t.length < SNO_MIN) return `고유 번호는 ${SNO_MIN}자 이상으로 입력해주세요.`;
  if(t.length > SNO_MAX) return `고유 번호는 ${SNO_MAX}자 이내로 입력해주세요.`;
  return null;
}
function checkSnoHint(el, hintId){
  const hint = $('#'+hintId); if(!hint || !el) return;
  const raw = el.value;
  const up = normSno(raw);
  if(up !== raw) el.value = up;          // 소문자로 적어도 대문자로 보여 줍니다
  if(!up){ hint.textContent = `영문과 숫자를 섞어 ${SNO_MIN}~${SNO_MAX}자로 입력해요.`; hint.style.color=''; el.classList.remove('err'); return; }
  const p = snoProblem(up);
  hint.textContent = p || `쓸 수 있는 번호예요. (${up.length} / ${SNO_MAX}자)`;
  hint.style.color = p ? 'var(--c-danger)' : 'var(--c-success)';
  el.classList.toggle('err', !!p);
}

function pinProblem(pin, number){
  if(!/^[0-9]{6}$/.test(pin)) return '비밀번호는 숫자 6자리로 입력해주세요.';
  if(pin === '202400') return '임시 비밀번호는 그대로 쓸 수 없어요. 나만의 번호로 바꿔주세요.';
  // 고유 번호와 3자리 이상 연속으로 겹치면 안 된다 (서버 checkPin 과 같은 규칙)
  //   번호에 영문이 섞일 수 있으므로 숫자만 뽑아서 확인합니다.
  const digits = String(number||'').replace(/[^0-9]/g,'');
  if(digits){
    for(let i=0; i+3<=digits.length; i++){
      const piece = digits.slice(i, i+3);
      if(pin.includes(piece)) return `비밀번호에 고유 번호의 숫자 "${piece}" 가 그대로 들어 있어요.`;
    }
  }
  if(/^(\d)\1{5}$/.test(pin)) return '같은 숫자만 반복하는 비밀번호는 쓸 수 없어요.';
  let up=true, down=true;
  for(let i=1;i<pin.length;i++){
    const d = pin.charCodeAt(i)-pin.charCodeAt(i-1);
    if(d!==1) up=false;
    if(d!==-1) down=false;
  }
  if(up||down) return '차례로 늘어나거나 줄어드는 비밀번호는 쓸 수 없어요.';
  return null;
}
// 입력하는 동안 바로 알려준다.
function checkPinHint(el){
  const hint = $('#pw-hint');
  if(!hint) return;
  const num = ($('#f-number')?.value || '').trim();
  const v = el.value.trim();
  if(!v){
    hint.textContent = '처음 입장할 때 정한 6자리예요. 고유 번호와 같은 숫자는 쓸 수 없어요.';
    hint.style.color = ''; el.classList.remove('err'); return;
  }
  // 로그인 화면에서는 자릿수만 알려준다 (임시 비밀번호로도 들어와야 하므로)
  hint.textContent = v.length < 6 ? `${v.length} / 6자리` : '';
  hint.style.color = ''; el.classList.remove('err');
}

function checkSignupPin(){
  const hint = $('#sg-hint'), el = $('#sg-pw');
  if(!hint || !el) return;
  const num = ($('#sg-number')?.value||'').trim();
  const v = el.value.trim();
  if(!v){ hint.textContent='고유 번호에 들어간 숫자 3자리가 이어서 들어가면 안 돼요.'; hint.style.color=''; el.classList.remove('err'); return; }
  if(v.length < 6){ hint.textContent = `${v.length} / 6자리`; hint.style.color=''; el.classList.remove('err'); return; }
  const p = pinProblem(v, num);
  hint.textContent = p || '쓸 수 있는 비밀번호예요.';
  hint.style.color = p ? 'var(--c-danger)' : 'var(--c-success)';
  el.classList.toggle('err', !!p);
}
function submitStudentSignup(){
  const num = normSno($('#sg-number').value);
  const nick = ($('#sg-nickname').value||'').trim();
  const pw = ($('#sg-pw').value||'').trim();
  const pw2 = ($('#sg-pw2').value||'').trim();
  const code = ($('#sg-code').value||'').trim().toUpperCase();
  const sp = snoProblem(num);
  if(sp){ $('#sg-number').classList.add('err'); toast(sp); return; }
  const np = nickProblem(nick);
  if(np){ $('#sg-nickname').classList.add('err'); toast(np); return; }
  const p = pinProblem(pw, num);
  if(p){ $('#sg-pw').classList.add('err'); toast(p); return; }
  if(pw !== pw2){ toast('비밀번호가 서로 달라요. 다시 확인해주세요.'); return; }
  if(!code){ toast('세션 코드를 입력해주세요.'); return; }
  toast('가입 기능이 아직 연결되지 않았어요.');
}

// 승인된 질문을 선생님이 만든 주제별로 묶어 보여준다. (주제에 없는 질문은 '기타'로)
function groupedQuestionsHTML(d, kind, approved, itemHTML){
  const topics = sessionTopics(d, kind);
  const used = new Set();
  const blocks = topics.map(t=>{
    const qs = (t.questionIds||[]).map(id=>approved.find(q=>String(q.id)===String(id))).filter(Boolean);
    qs.forEach(q=>used.add(String(q.id)));
    if(!qs.length) return '';
    return `
    <div style="margin-bottom:16px;">
      <div class="section-title" style="margin-bottom:8px; align-items:center;">
        <span style="font-size:var(--fs-title); font-weight:700; color:var(--c-primary); line-height:1.35;">${Icon.spark} ${esc(t.title)}</span>
        <span class="t-caption" style="flex:0 0 auto;">질문 ${qs.length}개</span>
      </div>
      ${qs.map(itemHTML).join('')}
    </div>`;
  }).join('');
  const rest = approved.filter(q=>!used.has(String(q.id)));
  const restBlock = rest.length ? `
    <div style="margin-bottom:16px;">
      <div class="section-title" style="margin-bottom:8px; align-items:center;">
        <span style="font-size:var(--fs-title); font-weight:700; color:var(--c-text-2); line-height:1.35;">${Icon.inbox} 주제 미지정</span>
        <span class="t-caption" style="flex:0 0 auto;">질문 ${rest.length}개</span>
      </div>
      ${rest.map(itemHTML).join('')}
    </div>` : '';
  return blocks + restBlock;
}

function teacherMaterialsBlock(){
  const list = sData().materials.filter(m=>m.owner!=='student');
  // 자료 유형(영상/이미지/글) 로 나누던 기능은 없앴습니다. 올라온 순서 그대로 보여 줍니다.
  const filtered = list;
  const unanswered = list.filter(m=>{
    const a = myAnswerFor(m);
    return (m.questions||[]).length && !(a && a.list.some(x=>x&&x.trim()));
  }).length;

  const head = `
    <div style="font-size:var(--fs-display); font-weight:800; color:var(--c-text); letter-spacing:-.01em; line-height:1.3;">${Icon.book} 선생님이 올린 자료</div>

    </p>`;

  if(!list.length){
    return `<div class="card" style="margin-bottom:14px;">${head}
      <div class="t-caption" style="color:var(--c-text-3);">아직 올라온 자료가 없어요.</div>
    </div>`;
  }
  const body = filtered.length ? filtered.map(m=>{
    const qCount = (m.questions||[]).length;
    const answered = myAnswerFor(m);
    const done = answered && answered.list.some(a=>a && a.trim());
    return `
    <div class="list-item" onclick="openMaterial(${m.id})">
      <div class="thumb" style="background:${MATERIAL_LOOK.color};">${MATERIAL_LOOK.icon}</div>
      <div style="min-width:0;flex:1;">

        <div class="t-caption">${m.date}${qCount?` · 질문 ${qCount}개`:''}</div>
      </div>
      ${qCount ? (done
        ? `<span class="badge badge-approved">${Icon.check} 답변완료</span>`
        : `<span class="badge badge-pending">${Icon.clock} 답변필요</span>`) : `<div style="color:var(--c-text-3);">${Icon.arrow}</div>`}
    </div>`;
  }).join('') : `<div class="t-caption" style="color:var(--c-text-3); padding:8px 2px;">아직 올라온 자료가 없어요.</div>`;

  return `<div class="card" style="margin-bottom:14px;">${head}${body}</div>`;
}

/* ---------- 답변 글자 수 검사 ---------- */
function qMin(m, i){
  if(qKind(m,i)==='choice') return 0;          // 객관식에는 글자 수 제한이 없습니다
  return Math.max(0, Number((m.questionMins||[])[i]) || 0);
}
function qKind(m, i){ return (m.questionKinds||[])[i]==='choice' ? 'choice' : 'text'; }
function qOptions(m, i){ const o=(m.questionOptions||[])[i]; return Array.isArray(o)?o:[]; }
function qAnswerIdx(m, i){
  const v = (m.questionAnswers||[])[i];
  return Number.isInteger(v) ? v : -1;
}
function answerLen(v){ return (v||'').trim().length; }
function answerBadgeClass(min, len){
  if(min<=0) return 'badge-closed';
  return len>=min ? 'badge-approved' : 'badge-pending';
}
function answerCountLabel(min, len){
  return min>0 ? `${len} / ${min}자` : `${len}자`;
}
function shortAnswers(m, draft){
  return (m.questions||[]).map((q,i)=>({ i, min:qMin(m,i), len:answerLen((draft||[])[i]) }))
    .filter(o=>o.min>0 && o.len<o.min);
}
// 객관식인데 아직 안 고른 질문
function unpickedChoices(m, draft){
  return (m.questions||[]).map((q,i)=>i)
    .filter(i=>qKind(m,i)==='choice' && !((draft||[])[i]||'').trim());
}
function answersOk(m, draft){
  const qs = m.questions || [];
  if(!qs.length) return false;
  if(shortAnswers(m, draft).length) return false;
  if(unpickedChoices(m, draft).length) return false;   // 객관식은 모두 골라야 합니다
  return qs.some((q,i)=>answerLen((draft||[])[i])>0);
}
function answerHintText(m, draft){
  const un = unpickedChoices(m, draft);
  if(un.length){
    return `아직 고르지 않은 객관식이 있어요 · ${un.map(i=>`Q${i+1}`).join(', ')}`;
  }
  const short = shortAnswers(m, draft);
  if(short.length){
    const need = short.map(o=>`Q${o.i+1}(${o.min-o.len}자 더)`).join(', ');
    return `아직 최소 글자 수를 채우지 못했어요 · ${need}`;
  }
  const qs = m.questions || [];
  const any = qs.some((q,i)=>answerLen((draft||[])[i])>0);
  return any ? '' : '답변을 한 개 이상 작성해주세요.';
}
// 객관식 보기 고르기. 같은 보기를 다시 누르면 선택이 풀립니다.
function pickChoice(id, i, j){
  const m = sData().materials.find(x=>String(x.id)===String(id));
  if(!m) return;
  const key = 'm'+id;
  if(!state.answerDraft[key]) state.answerDraft[key] = (m.questions||[]).map(()=> '');
  const opt = qOptions(m,i)[j] || '';
  state.answerDraft[key][i] = (state.answerDraft[key][i]===opt) ? '' : opt;
  render();
}
function onAnswerInput(id, i, el){
  const key = 'm'+id;
  if(!state.answerDraft[key]) state.answerDraft[key]=[];
  state.answerDraft[key][i] = el.value;
  refreshAnswerUI(id);
}
function refreshAnswerUI(id){
  const m = sData().materials.find(x=>x.id===id);
  if(!m) return;
  const draft = state.answerDraft['m'+id] || [];
  (m.questions||[]).forEach((q,i)=>{
    const badge = $('#acnt-'+i);
    if(!badge) return;
    const min = qMin(m,i), len = answerLen(draft[i]);
    badge.textContent = answerCountLabel(min, len);
    badge.className = 'badge ' + answerBadgeClass(min, len);
  });
  const hint = $('#ans-hint');
  if(hint) hint.textContent = answerHintText(m, draft);
  const btn = $('#ans-submit');
  if(btn) btn.disabled = !answersOk(m, draft);
}
function submitAnswers(id){
  const m = sData().materials.find(x=>x.id===id);
  const draft = state.answerDraft['m'+id] || [];
  const short = shortAnswers(m, draft);
  if(short.length){
    toast(`Q${short[0].i+1} 답변을 ${short[0].min}자 이상 적어주세요. (지금 ${short[0].len}자)`);
    return;
  }
  const un = unpickedChoices(m, draft);
  if(un.length){ toast(`Q${un[0]+1} 보기를 골라주세요.`); return; }
  if(!draft.some(a=>a && a.trim())){ toast('답변을 한 개 이상 작성해주세요.'); return; }
  m.answers = m.answers || [];
  const existing = m.answers.find(a=>a.number===MOCK.student.number);
  const payload = {
    number: MOCK.student.number,
    who: MOCK.student.nickname,
    at: nowLabel(),
    list: [...draft]
  };
  if(existing) Object.assign(existing, payload);
  else m.answers.push(payload);
  render(); toast('답변을 제출했어요.');
}

// 지금까지 진행해서 열린 가장 마지막 단계
function maxStepReached(){
  if(!s1Done()) return 1;
  if(!s2Done()) return 2;
  if(state.step3.phase!=='done') return 3;
  if(!s4Done()) return 4;
  return 5;
}
// 지금 보고 있는 단계 (열린 범위를 넘지 않도록 조정)
function studentStepNo(){
  const max = maxStepReached();
  let v = Number(state.stepView) || 1;
  if(v > max) v = max;
  if(v < 1) v = 1;
  return v;
}
// 단계 이동 — 앞 단계 내용은 지우지 않고 그대로 보관합니다.
function goStep(n){
  const max = maxStepReached();
  if(n < 1) return;
  if(n > max){ toast('앞 단계를 먼저 마쳐주세요.'); return; }
  state.stepView = n;
  render();
  window.scrollTo(0,0);
}
function goToStep4(){ state.step3.acked = true; goStep(4); }
function backToStep3(){ goStep(3); }
function s1Done(){ return !!state.step1Type && !!state.step[1] && state.step[1].trim().length>0; }
function s2Done(){ return filledStep2().length > 0; }
function s4Done(){ return filledStep4().length > 0; }

// 이전 단계에서 적은 내용을 다음 단계에서도 계속 볼 수 있게 한다.
function stepSummaryHTML(n){
  const rows = [];
  if(n > 1 && s1Done()){
    const t = step1Type(state.step1Type);
    rows.push([`STEP 1 · ${t ? t.label : '상상의 질문'}`, state.step[1], 1]);
  }
  if(n > 2 && s2Done()){
    filledStep2().forEach(o=>rows.push([`STEP 2 · ${o.label}`, o.text, 2]));
  }
  if(n > 3 && state.step3.result){
    (state.step3.result.items||[]).forEach(it=>rows.push([
      `STEP 3 · AI 피드백${it.label?` (${it.label})`:''}`,
      (it.level ? `[${it.level}] ` : '') + (it.feedback||''), 3]));
  }
  if(n > 4 && s4Done()){
    filledStep4().forEach(o=>rows.push([`STEP 4 · 최종 질문 (${o.label})`, o.text, 4]));
  }
  if(!rows.length) return '';
  return `
  <div class="card" style="margin-bottom:12px; background:var(--c-neutral-bg); border:none;">
    <div class="row-between" style="cursor:pointer;" onclick="state.showStepSummary = state.showStepSummary===false; render();">
      <span class="t-caption" style="font-weight:700; color:var(--c-text);">${Icon.doc} 앞에서 적은 내용</span>
      <span class="t-caption">${state.showStepSummary===false?'펼치기':'접기'}</span>
    </div>
    ${state.showStepSummary===false ? '' : `<div class="stack" style="margin-top:10px;">${rows.map(([k,v,go])=>`
      <div>
        <div class="row-between">
          <span class="t-caption" style="font-weight:600; color:var(--c-text);">${k}</span>
          <button class="btn btn-text t-caption" style="padding:0;" onclick="goStep(${go})">고치러 가기</button>
        </div>
        <div class="t-caption">${esc(v)}</div>
      </div>`).join('')}</div>`}
  </div>`;
}

/* =========================================================
   차시 (수업 회차)
   · 선생님이 [자료 업로드] 화면에서 차시를 늘리거나 이름을 고칩니다.
   · [질문 만들기] 와 [글쓰기] 는 차시마다 따로 만들고 따로 제출합니다.
   · 지금 보고 있는 차시의 내용은 state.step* / state.essay* 에 그대로 두고,
     다른 차시로 옮길 때 state.inqRounds / state.essayRounds 에 통째로
     넣었다가 다시 꺼냅니다. (기존 화면 코드를 그대로 쓰기 위해서입니다)
========================================================= */
function blankRound(n){
  return {
    id:'r'+n, label:n+'차시', note:'', essayTopic:'',
    questionTypes:[],     // 비어 있으면 세 가지 유형을 모두 씁니다
    essayOpen:false,      // 이 차시의 글쓰기를 열었는지 (= 이탈 경고)
  };
}
// 세션의 차시 목록. 없으면 1차시 하나를 만들어 둡니다.
function roundsOf(d){
  if(!d) return [];
  if(!Array.isArray(d.rounds) || !d.rounds.length) d.rounds = [blankRound(1)];
  return d.rounds;
}
/* ---------- 교사가 지금 설정 중인 차시 ---------- */
function tRounds(){ return roundsOf(tData()); }
function tRound(){
  const list = tRounds();
  const r = list.find(x=>x.id === state.tRoundId);
  if(r) return r;
  state.tRoundId = list[0] ? list[0].id : null;
  return list[0] || null;
}
function setTRound(rid){ state.tRoundId = rid; render(); }
function setMonitorRound(rid){ state.monitorRound = rid; render(); }
// 이 차시의 글쓰기가 열려 있는지
function roundEssayOpen(d, r){ return !!(r && r.essayOpen === true); }
// 이 차시의 글쓰기 주제 (비어 있으면 세션 공통 주제)
function roundEssayTopic(d, r){
  if(r && r.essayTopic) return r.essayTopic;
  return (d && d.essayTopic) || '';
}
function myRounds(){ return roundsOf(sData()); }
function roundById(list, id){ return list.find(r=>r.id===id) || list[0] || null; }
function roundLabel(d, id){ const r = roundById(roundsOf(d), id); return r ? r.label : ''; }

/* ---------- 질문 만들기 : 차시별 보관 ---------- */
function inqBlank(){
  return {
    step1Type:'', step1:'',
    step2By:{ reflective:'', debate:'', problem:'' },
    step3:{ topic:'', question:'', phase:'idle', result:null, acked:false },
    step4By:{ reflective:'', debate:'', problem:'' },
    extraQs:[], stepView:1, submitted:false,
  };
}
function inqSnapshot(){
  return {
    step1Type: state.step1Type, step1: state.step[1],
    step2By: Object.assign({}, state.step2By),
    step3: JSON.parse(JSON.stringify(state.step3)),
    step4By: Object.assign({}, state.step4By),
    extraQs: (state.extraQs||[]).slice(),
    stepView: state.stepView, submitted: !!state.inqSubmitted,
  };
}
function applyInq(o){
  state.step1Type = o.step1Type || '';
  state.step[1]   = o.step1 || '';
  state.step2By   = Object.assign({ reflective:'', debate:'', problem:'' }, o.step2By||{});
  state.step3     = Object.assign({ topic:'', question:'', phase:'idle', result:null, acked:false }, o.step3||{});
  state.step4By   = Object.assign({ reflective:'', debate:'', problem:'' }, o.step4By||{});
  state.extraQs   = normalizeExtras(o.extraQs);
  state.stepView  = o.stepView || 1;
  state.inqSubmitted = !!o.submitted;
}
function saveInqRound(){ state.inqRounds[state.inqRoundId] = inqSnapshot(); }
function switchInqRound(rid){
  if(rid === state.inqRoundId) return;
  saveInqRound();
  applyInq(state.inqRounds[rid] || inqBlank());
  state.inqRoundId = rid;
  render(); window.scrollTo(0,0);
}
function inqRoundDone(rid){
  if(rid === state.inqRoundId) return !!state.inqSubmitted;
  const o = state.inqRounds[rid];
  return !!(o && o.submitted);
}

/* ---------- 글쓰기 : 차시별 보관 ---------- */
function essayBlank(){
  return { steps:['','','','',''], lastGen:['','','','',''], text:'', touched:false, submitted:false,
           submitCount:0, submitLog:[] };
}
function essaySnapshot(){
  return {
    steps: state.essaySteps.slice(), lastGen: state.essayLastGen.slice(),
    text: state.essayText, touched: !!state.essayTouched, submitted: !!state.essaySubmitted,
    submitCount: state.essaySubmitCount||0, submitLog: (state.essaySubmitLog||[]).slice(),
  };
}
function applyEssay(o){
  state.essaySteps   = (o.steps   || ['','','','','']).slice();
  state.essayLastGen = (o.lastGen || ['','','','','']).slice();
  state.essayText    = o.text || '';
  state.essayTouched = !!o.touched;
  state.essaySubmitted = !!o.submitted;
  state.essaySubmitCount = o.submitCount || 0;
  state.essaySubmitLog = Array.isArray(o.submitLog) ? o.submitLog : [];
}
function saveEssayRound(){ state.essayRounds[state.essayRoundId] = essaySnapshot(); }
function switchEssayRound(rid){
  if(rid === state.essayRoundId) return;
  saveEssayRound();
  applyEssay(state.essayRounds[rid] || essayBlank());
  state.essayRoundId = rid;
  render(); window.scrollTo(0,0);
}
function essayRoundDone(rid){
  if(rid === state.essayRoundId) return !!state.essaySubmitted;
  const o = state.essayRounds[rid];
  return !!(o && o.submitted);
}
// 이번 차시의 글쓰기 주제 (차시별로 없으면 세션 전체 주제를 씁니다)
function myEssayTopic(){
  return roundEssayTopic(sData(), roundById(myRounds(), state.essayRoundId));
}

/* ---------- 차시 고르는 줄 (학생 화면 맨 위) ---------- */
function roundBarHTML(kind){
  const rounds = myRounds();
  const cur = kind==='inq' ? state.inqRoundId : state.essayRoundId;
  const fn  = kind==='inq' ? 'switchInqRound' : 'switchEssayRound';
  const r   = roundById(rounds, cur);
  const note = kind==='inq' ? (r && r.note) : '';
  return `
  <div class="card" style="margin-bottom:14px; padding:12px 14px;">
    <div class="row-between" style="margin-bottom:8px;">
      <span class="t-caption" style="font-weight:700; color:var(--c-text);">${Icon.book} 차시 고르기</span>
      <span class="t-caption">${rounds.length}차시까지 열려 있어요</span>
    </div>
    <div class="chip-row">
      ${rounds.map(x=>{
        const done = kind==='inq' ? inqRoundDone(x.id) : essayRoundDone(x.id);
        return `<button class="chip ${x.id===cur?'active':''}" onclick="${fn}('${x.id}')">${esc(x.label)}${done?` ${Icon.check}`:''}</button>`;
      }).join('')}
    </div>
    ${note ? `<div class="t-caption" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--c-border);">${esc(note)}</div>` : ''}
  </div>`;
}

/* =========================================================
   질문 만들기 — 질문 유형 정의
   STEP 1 : 두 가지 중 하나를 골라 상상의 질문을 적어봅니다.
   STEP 2 : 선생님이 지정한 유형(최대 3가지)별로 구체적인 질문을 만듭니다.
========================================================= */
const STEP1_TYPES = [
  { k:'affective', label:'정의적 질문',
    desc:'사람, 동물, 사물 등에 감정을 이입하여 상상해보는 감정의 질문',
    ph:'예: 베어진 나무는 어떤 마음이었을까?' },
  { k:'hypothetical', label:'가설적 질문',
    desc:'무언가를 예상하는 질문으로, 반대로 되었다면 어떻게 될까 하는 상상의 질문',
    ph:'예: 만약 우리 동네에 나무가 한 그루도 없다면 어떻게 될까?' },
];
const STEP2_TYPES = [
  { k:'reflective', label:'성찰적 질문',
    desc:"'A와 B는 어떤 관계가 있을까?' 혹은 'A는 B에게 어떤 영향을 끼치는가?' 형식의 질문",
    ph:'예: 플라스틱 사용은 우리 동네 환경에 어떤 영향을 끼치는가?' },
  { k:'debate', label:'논쟁적 질문',
    desc:'찬반 논쟁으로 토론할 수 있는 질문',
    ph:'예: 일회용품 사용을 법으로 금지해야 하는가?' },
  { k:'problem', label:'문제 해결을 위한 질문',
    desc:'문제의 원인과 해결 방안을 생각하는 질문',
    ph:'예: 우리 학교 급식 잔반을 줄이려면 무엇부터 바꿔야 할까?' },
];
function step1Type(k){ return STEP1_TYPES.find(t=>t.k===k); }
function step2Type(k){ return STEP2_TYPES.find(t=>t.k===k); }
// 선생님이 지정한 STEP 2 질문 유형 (지정이 없으면 세 가지 모두)
//  차시별로 정해 두었으면 그것을, 비어 있으면 세 가지를 모두 씁니다.
function activeStep2Types(d, r){
  const list = (r && Array.isArray(r.questionTypes) && r.questionTypes.length)
    ? r.questionTypes : STEP2_TYPES.map(t=>t.k);
  return STEP2_TYPES.filter(t=>list.includes(t.k));
}
// 학생이 지금 보고 있는 차시의 질문 유형
function myStep2Types(){
  const d = sData();
  return activeStep2Types(d, roundById(roundsOf(d), state.inqRoundId));
}
// 학생이 지금까지 채운 STEP 2 질문 (빈 칸은 뺀다)
function filledStep2(){
  return myStep2Types()
    .map(t=>({ k:t.k, label:t.label, text:(state.step2By[t.k]||'').trim() }))
    .filter(o=>o.text.length>0);
}
function filledStep4(){
  return myStep2Types()
    .map(t=>({ k:t.k, label:t.label, text:(state.step4By[t.k]||'').trim() }))
    .filter(o=>o.text.length>0);
}

function studentP3Step(){
  const n = studentStepNo();
  if(n===1) return studentP3Step1();
  if(n===2) return studentP3Step2();
  if(n===3) return studentP3Step3();
  if(n===4) return studentP3Step4();

}

function addExtraQ(){
  const el = $('#extra-q');
  const v = (el ? el.value : '').trim().replace(/\s+/g,' ');
  if(!v){ toast('질문을 입력해주세요.'); return; }
  if(v.length > QUESTION_MAX){ toast(`질문은 ${QUESTION_MAX}자 이내로 적어주세요.`); return; }
  if((state.extraQs||[]).some(x=>extraText(x)===v)){ toast('이미 더한 질문이에요.'); return; }
  if((state.extraQs||[]).length >= 10){ toast('질문은 10개까지 더할 수 있어요.'); return; }
  state.extraQs = (state.extraQs||[]).concat([extraItem(v, false)]);
  render();
  const el2 = $('#extra-q'); if(el2) el2.focus();
  toast('질문을 더했어요.');
}
function removeExtraQ(i){
  state.extraQs = (state.extraQs||[]).filter((_,idx)=>idx!==i);
  render();
}

function setExtraPrivacy(i, priv){
  const list = (state.extraQs||[]).slice();
  if(!list[i]) return;
  list[i] = extraItem(extraText(list[i]), priv);
  state.extraQs = list;
  render();
  toast(priv ? '비공개로 바꿨어요. 선생님과 나만 볼 수 있어요.' : '공개로 바꿨어요.');

function finalizeQuestions(){
  const list = filledStep4();
  const extras = state.extraQs || [];
  if(!list.length){ toast('STEP 4의 최종 질문을 한 개 이상 입력해주세요.'); goStep(4); return; }
  const label = roundLabel(sData(), state.inqRoundId);
  const now = Date.now();
  const mk = (text, i, extra, o, priv) => ({
    id: now+i, author: MOCK.student.nickname||'나', question: text,
    qtype: extra ? '' : o.k, qtypeLabel: extra ? '' : o.label,
    round: label, extra: !!extra, isPrivate: !!priv, mine: true,
    curious:0, likes:0, myCurious:false, myLike:false,
    approvedForExplore:false, approvedForDiscussion:false, comments:[]
  });
  list.forEach((o,i)=> sData().shared.unshift(mk(o.text, i, false, o, false)));
  extras.forEach((x,i)=> sData().shared.unshift(
    mk(extraText(x), list.length+i, true, null, extraPrivate(x))));
  state.inqSubmitted = true;
  saveInqRound();

  { n:5, title:'종합하여 마무리하기', hint:'앞의 내용을 정리해 결론을 내려요.', conn:['따라서','그 결과'], ph:'예) 개인의 실천과 기업·제도의 변화가 함께 이루어져야 한다.' },
];
function essayTidy(text){
  //  긴 표현을 먼저 두어야 '그 이유는 다음과 같다.' 가 '그 이유는' 으로 잘리지 않습니다.
  const ALL_CONN = ['그 이유는 다음과 같다.','왜냐하면','그 이유는','예를 들어','반면에','하지만','따라서','그 결과','그래서'];
  let t = (text||'').trim().replace(/\s+/g,' ');
  if(!t) return '';
  for(const c of ALL_CONN){ if(t.startsWith(c)){ t = t.slice(c.length).replace(/^[,\s]+/,''); break; } }
  return t;
}
function essayPunct(text){
  const t = (text||'').trim();
  if(!t) return '';
  return /[.!?…]$/.test(t) ? t : t+'.';
}
function genEssaySentences(){
  const conns = [null, state.essayConn2, '예를 들어', '반면에', state.essayConn5];
  return state.essaySteps.map((raw,i)=>{
    const body = essayTidy(raw);
    if(!body) return '';
    const c = conns[i];
    if(!c) return essayPunct(body);
    // '그 이유는 다음과 같다.' 처럼 그 자체가 한 문장인 이음말은 앞 문장으로 두고,
    // 학생이 쓴 내용을 그 뒤에 새 문장으로 붙입니다.
    if(/[.!?]$/.test(c)) return `${c} ${essayPunct(body)}`;
    return essayPunct(`${c} ${body}`);
  });
}
function spliceEssaySentence(final, oldS, newS, index, lastGen){
  const text = final || '';
  if(oldS && text.includes(oldS)){
    if(newS) return text.replace(oldS, ()=>newS);
    return text.replace(oldS, ()=>'').replace(/\s{2,}/g,' ').trim();
  }
  if(!newS) return text;
  for(let j=index+1; j<lastGen.length; j++){
    const anchor = lastGen[j];
    if(anchor && text.includes(anchor)){
      const at = text.indexOf(anchor);
      const head = text.slice(0,at).trimEnd();
      const tail = text.slice(at);
      return `${head}${head?' ':''}${newS} ${tail}`.trim();
    }
  }
  const head = text.trimEnd();
  return `${head}${head?' ':''}${newS}`;
}
function updateEssayFromStep(idx){
  const newGen = genEssaySentences();
  const newS = newGen[idx];
  state.essayText = spliceEssaySentence(state.essayText, state.essayLastGen[idx], newS, idx, state.essayLastGen);
  state.essayLastGen[idx] = newS;
}

  const cc = $('#essay-count'); if(cc) cc.textContent = state.essayText.length+'자';
  const badge = $('#estep-badge-'+idx);
  if(badge){ const done = !!el.value.trim(); badge.style.background = done? 'var(--c-primary)':''; badge.style.color = done? '#fff':''; }
  const stepCount = $('#estep-count'); if(stepCount) stepCount.textContent = state.essaySteps.filter(s=>s.trim()).length+'/5 단계';
}

/* ---------- 집중 모드 (전체화면) ----------
   브라우저는 웹 페이지가 다른 창을 닫게 해 주지 않습니다. (보안상 당연한 제약)
   대신 전체화면으로 들어가면 옆에 다른 창을 띄우기 번거로워집니다.
   강제할 수는 없고 ESC 로 언제든 나갈 수 있으므로, 나가면 이탈로 셉니다.
------------------------------------------- */
function fsElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function fsSupported(){
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen);
}
function enterFocusMode(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!req){ toast('이 기기에서는 전체화면을 쓸 수 없어요.'); return Promise.reject(); }
  return Promise.resolve(req.call(el)).then(()=>{
    state.focusMode = true;
    state.focusUsed = true;
    render();
    toast('집중 모드를 켰어요. ESC 를 누르면 나가집니다.');
  }).catch((e)=>{ toast('전체화면으로 바꾸지 못했어요. 다시 눌러주세요.'); throw e; });
}
// ESC 등으로 전체화면이 풀렸을 때
function onFullscreenChange(){
  const on = !!fsElement();
  const was = state.focusMode;
  state.focusMode = on;
  if(was && !on){
    // 학생이 스스로 나간 것이므로 이탈로 셉니다.
    //   앱을 벗어나면서 전체화면이 함께 풀리는 경우, blur/숨김 신호도 같이 옵니다.
    //   여기서 awayNow 를 되돌리면 그 신호가 또 세어져 1회가 2회가 됩니다.
    //   그대로 두면 '나가 있는 상태' 가 유지되어 한 번만 세어지고,
    //   화면을 만지거나 포커스가 돌아올 때 알아서 풀립니다.
    handleLeaveEvent('집중 모드(전체화면)에서 나감');
  }
  render();
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

function handleLeaveEvent(reason){
  if(!leaveWarnOn() || state.essaySubmitted) return;
  // 이탈을 세기 시작하는 시점 :
  //   · 전체화면을 쓸 수 있는 기기 → 학생이 [집중 모드 켜기] 를 직접 누른 뒤부터
  //   · 전체화면을 못 쓰는 기기   → 집중 모드를 켤 방법이 없으므로, [글쓰기] 탭을 연 뒤부터
  //   예전에는 [글쓰기] 탭을 열기만 해도 세기 시작해서, 탭을 잠깐 들여다본 학생에게
  //   경고창이 뜨고 그 창의 버튼이 전체화면을 켜 버렸습니다. (집중 모드가 저절로 켜지던 문제)
  const started = fsSupported() ? state.focusUsed : state.essayEngaged;
  if(!started) return;
  if(awayNow) return;                  // 이미 나가 있는 중이면 더 세지 않습니다
  awayNow = true;
  state.essayLeaveTotal += 1;
  state.essayLeaveLog.push({at: nowLabel(), reason});
  render();
  // 전체화면은 '학생이 직접 누른 동작' 에서만 켤 수 있습니다. (브라우저 규칙)
  //   그래서 돌아왔을 때 자동으로 켜지 못하고, 이 버튼을 누르는 것을 그 동작으로 씁니다.
  const withFs = fsSupported() && !fsElement();
  // 전체화면을 쓸 수 있는 기기에서는 닫기 버튼도, 바깥 누르기도 없앱니다.
  //   집중 모드로 돌아가는 것 말고는 빠져나갈 길이 없습니다.
  //   (전체화면을 못 쓰는 기기라면 갇혀 버리므로 그때는 그냥 닫을 수 있게 둡니다)
  const open = withFs ? openLockedModal : openCenterModal;
  open(`
    <div class="sheet-title" style="color:var(--c-danger); display:flex; align-items:center; gap:8px;">${Icon.alert} 글쓰기 화면을 벗어났어요</div>
    <p class="t-body" style="margin:10px 0 12px;">${esc(reason)} — 지금까지 <b>${state.essayLeaveTotal}회</b> 이탈했고, 이 기록은 선생님 화면에 표시돼요.</p>
    ${withFs
      ? `<p class="t-caption" style="margin-bottom:16px;">계속하려면 아래를 눌러 <b>집중 모드로 돌아가야 해요.</b>
           이 창은 다른 방법으로는 닫을 수 없어요.</p>`
      : ''}
    <button class="btn btn-danger btn-block" onclick="backToEssay()">
      ${withFs ? '집중 모드로 돌아가기' : '글쓰기로 돌아가기'}
    </button>
  `);
}
// 화면으로 돌아왔을 때. 다음 이탈을 다시 셀 수 있게 되돌립니다.
function handleReturnEvent(){
  if(!awayNow) return;
  awayNow = false;
  onEssayReturn();          // 못 보낸 기록이 있으면 이때 다시 보냅니다
}
// 실제 저장은 배포본에서 덮어씁니다. (미리보기에서는 할 일이 없습니다)
function onEssayReturn(){}
function backToEssay(){
  const goEssay = ()=>{
    closeModal();
    if(state.route==='student-app' && state.studentTab!=='p6') setStudentTab('p6');
  };
  // 전체화면 요청은 누른 직후에 해야 합니다. (시간이 지나면 브라우저가 거부합니다)
  if(fsSupported() && !fsElement()){
    // 전체화면이 되어야만 경고창이 닫힙니다. 실패하면 창을 그대로 둡니다.
    enterFocusMode().then(goEssay).catch(()=>{});
    return;
  }
  goEssay();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) handleLeaveEvent('탭 전환 또는 창 최소화');
  else handleReturnEvent();
});
window.addEventListener('blur',  ()=>{ handleLeaveEvent('화면을 벗어남'); });
window.addEventListener('focus', handleReturnEvent);
// 안전장치 : 어떤 이유로 '돌아옴' 신호를 못 받더라도, 학생이 화면을 만지면
//   돌아온 것으로 봅니다. (이게 없으면 그 뒤의 이탈을 영영 세지 못합니다)
document.addEventListener('pointerdown', handleReturnEvent, true);
document.addEventListener('keydown',     handleReturnEvent, true);

  const code = ($('#ts-code').value||'').trim().toLowerCase();
  const token = ($('#ts-token').value||'').trim().toUpperCase();
  const pw = $('#ts-pw').value||'', pw2 = $('#ts-pw2').value||'';

  if(pw.length < 8){ toast('비밀번호는 8자 이상으로 정해주세요.'); return; }
  if(pw !== pw2){ toast('비밀번호가 서로 달라요. 다시 확인해주세요.'); return; }
  toast('설정 기능이 아직 연결되지 않았어요.');
}

function teacherBrainByQuestion(sorted){
  if(!sorted.length) return `<div class="state-block"><div class="state-icon">${Icon.inbox}</div><div class="state-title">아직 등록된 질문이 없어요</div><div class="state-desc">학생이 질문을 입력하면 이곳에 표시돼요.</div></div>`;
  return sorted.map(q=>{
    const by = q.by || [];
    const names = [...new Set(by.map(e=>e.who))];
    const n = askedCount(q);
    return `
    <div class="card" style="padding:14px 16px;">
      <div class="row-between" style="align-items:flex-start; gap:8px; margin-bottom:8px;">
        <span class="t-body" style="flex:1; min-width:0;">${esc(q.t)}</span>
        ${n>1 ? `<span class="badge badge-active" style="flex:0 0 auto;">${Icon.users} ${n}회</span>` : ''}
      </div>
      ${names.length ? `<div style="display:flex; flex-wrap:wrap; gap:6px;">${names.map(nm=>{
          const cnt = by.filter(e=>e.who===nm).length;
          return `<span class="chip" style="cursor:default; padding:5px 10px; font-size:12px;">${esc(nameWithNumber(nm))}${cnt>1?` ×${cnt}`:''}</span>`;
        }).join('')}</div>`
        : `<div class="t-caption">입력자 정보가 없어요.</div>`}
    </div>`;
  }).join('');
}

function teacherBrainByStudent(items){
  const map = {};
  items.forEach(q=>(q.by||[]).forEach(e=>{
    if(!map[e.who]) map[e.who]=[];
    map[e.who].push(q.t);
  }));
  const students = tData().students;
  const rows = students.map(s=>({
    name: s.nickname || '(미설정)',
    number: s.number,
    list: map[s.nickname] || []
  }));
  Object.keys(map).forEach(nm=>{
    if(!students.some(s=>s.nickname===nm)) rows.push({name:nm, number:'-', list:map[nm]});
  });
  if(!rows.length) return `<div class="state-block"><div class="state-icon">${Icon.inbox}</div><div class="state-title">참여한 학생이 없어요</div></div>`;

  return rows.map(r=>`
    <div class="card" style="padding:14px 16px;">
      <div class="row-between" style="margin-bottom:8px;">
        <span style="display:flex; align-items:center; gap:8px; min-width:0;">
          <span class="avatar" style="width:28px;height:28px;font-size:12px;">${esc((r.name||'?')[0])}</span>
          <span style="min-width:0;">
            <span class="t-body-md">${esc(r.name)}</span>
            <span class="t-caption"> · ${r.number}</span>
          </span>
        </span>
        ${r.list.length
          ? `<span class="badge badge-approved">${Icon.check} ${r.list.length}개</span>`
          : `<span class="badge badge-pending">${Icon.clock} 미입력</span>`}
      </div>
      ${r.list.length
        ? `<ul class="stack" style="margin:0; padding:0; list-style:none; gap:6px;">${r.list.map(t=>`
            <li class="t-caption" style="display:flex; gap:6px;">
              <span style="color:var(--c-primary); flex:0 0 auto;">Q</span>
              <span style="color:var(--c-text);">${esc(t)}</span>
            </li>`).join('')}</ul>`
        : `<div class="t-caption">아직 질문을 입력하지 않았어요.</div>`}
    </div>`).join('');
}

function teacherBrainLog(items){
  const log = [];
  items.forEach(q=>(q.by||[]).forEach(e=>log.push({question:q.t, who:e.who, at:e.at||'-'})));
  log.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  if(!log.length) return `<div class="state-block"><div class="state-icon">${Icon.inbox}</div><div class="state-title">입력 기록이 없어요</div></div>`;
  return `
  <div class="table-scroll"><table class="datatable">
    <thead><tr><th>입력 시각</th><th>고유 번호</th><th>별명</th><th>질문</th></tr></thead>
    <tbody>${log.map(l=>`<tr><td style="white-space:nowrap;">${esc(l.at)}</td><td>${esc(numberOf(l.who)||'-')}</td><td>${esc(l.who)}</td><td>${esc(l.question)}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

function addRound(){
  const list = roundsOf(tData());
  if(list.length >= 12){ toast('차시는 12개까지 만들 수 있어요.'); return; }
  let n = list.length + 1;
  while(list.some(r=>r.id === 'r'+n)) n++;
  list.push(blankRound(n));
  render(); toast(`${n}차시를 추가했어요.`);
}
function editRound(id){
  const r = roundById(roundsOf(tData()), id);
  if(!r) return;
  openCenterModal(`
    <div class="sheet-title">차시 설정</div>
    <div class="field" style="margin-top:12px;"><label>차시 이름</label>
      <input class="input" id="rd-label" value="${esc(r.label)}" maxlength="20" placeholder="예: 2차시">
    </div>
    <div class="field"><label>이 차시 안내문 <span class="t-caption">(질문 만들기 화면에 보여요)</span></label>
      <textarea class="textarea" id="rd-note" style="min-height:60px;"
        placeholder="예: 오늘은 2번, 3번 자료만 살펴봅니다.">${esc(r.note||'')}</textarea>
    </div>
    <div class="field"><label>이 차시 글쓰기 주제 <span class="t-caption">(비우면 공통 주제를 씁니다)</span></label>
      <textarea class="textarea" id="rd-topic" style="min-height:60px;"
        placeholder="예: 우리 동네 나무를 지키려면 무엇부터 해야 할까?">${esc(r.essayTopic||'')}</textarea>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline btn-block" onclick="closeModal()">취소</button>
      <button class="btn btn-primary btn-block" onclick="saveRound('${r.id}')">저장</button>
    </div>`);
}
function saveRound(id){
  const r = roundById(roundsOf(tData()), id);
  if(!r) return;
  const label = ($('#rd-label').value||'').trim();
  if(!label){ toast('차시 이름을 입력해주세요.'); return; }
  r.label = label;
  r.note = ($('#rd-note').value||'').trim();
  r.essayTopic = ($('#rd-topic').value||'').trim();
  closeModal(); render(); toast('차시 설정을 저장했어요.');
}
function deleteRound(id){
  const list = roundsOf(tData());
  if(list.length <= 1){ toast('차시는 최소 한 개가 있어야 해요.'); return; }
  const r = roundById(list, id);
  openCenterModal(`
    <div class="sheet-title">${esc(r.label)}을(를) 지울까요?</div>
    <p class="t-body" style="margin:10px 0 18px;">학생이 이 차시에 만든 질문과 글은 화면에서 보이지 않게 됩니다.
      이미 공유한 질문은 [친구들 질문]에 그대로 남아요.</p>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline btn-block" onclick="closeModal()">취소</button>
      <button class="btn btn-danger btn-block" onclick="confirmDeleteRound('${id}')">지우기</button>
    </div>`);
}
function confirmDeleteRound(id){
  const d = tData();
  d.rounds = roundsOf(d).filter(r=>r.id!==id);
  closeModal(); render(); toast('차시를 지웠어요.');
}

/* =========================================================
   자료 질문 편집기 (새 자료 업로드 / 이미 올린 자료 수정 에서 함께 씁니다)
     t = 'up'   : 새 자료 업로드 칸
     t = 'edit' : 이미 올린 자료를 고치는 칸
========================================================= */
const MAX_CHOICES = 5, MIN_CHOICES = 2;
function qeList(t){
  if(t==='edit'){ if(!Array.isArray(state.editQuestions)) state.editQuestions=[]; return state.editQuestions; }
  if(!Array.isArray(state.uploadQuestions)) state.uploadQuestions=[blankUQ()];
  return state.uploadQuestions;
}
// 질문 한 칸의 빈 모양. kind 는 'text'(서술형) 또는 'choice'(객관식).
function blankUQ(){ return { prompt:'', min:0, kind:'text', options:['','','',''], answer:-1 }; }
// 서버에서 온 질문을 편집기 모양으로 맞춥니다. (예전 질문은 모두 서술형)
function toUQ(q){
  return {
    id: q.id ?? null,
    prompt: q.prompt || '',
    min: clampMin(q.min),
    kind: q.kind === 'choice' ? 'choice' : 'text',
    options: (Array.isArray(q.options) && q.options.length ? q.options.slice(0,MAX_CHOICES) : ['','','','']),
    answer: Number.isInteger(q.answer) ? q.answer : -1,
  };
}

function qeCard(t, q, i, total){
  const min = Number(q.min)||0;
  const isChoice = q.kind==='choice';
  return `
  <div style="border:1px solid var(--c-border); border-radius:var(--radius-md); padding:12px 12px 10px;">
    <div style="display:flex; gap:8px; align-items:flex-start;">
      <span class="avatar" style="width:26px;height:26px;font-size:12px;">${i+1}</span>
      <textarea class="textarea" style="min-height:60px; flex:1;" placeholder="예: 자료를 보고 새롭게 알게 된 점은 무엇인가요?" oninput="qeInput('${t}',${i},this)">${esc(q.prompt||'')}</textarea>
      ${total>1 ? `<button class="btn-icon" title="이 질문 빼기" onclick="qeDel('${t}',${i})">${Icon.x}</button>`:''}
    </div>
    <div style="margin-top:10px; padding-left:34px;">
      <div class="chip-row" style="margin-bottom:10px;">
        <button class="chip ${isChoice?'':'active'}" style="padding:5px 14px; font-size:12px;" onclick="qeKind('${t}',${i},'text')">서술형</button>
        <button class="chip ${isChoice?'active':''}" style="padding:5px 14px; font-size:12px;" onclick="qeKind('${t}',${i},'choice')">객관식</button>
      </div>
      ${isChoice ? qeChoiceHTML(t,q,i) : qeTextHTML(t,min,i)}
    </div>
  </div>`;
}
function qeTextHTML(t, min, i){
  return `
    <div class="row-between" style="margin-bottom:6px;">
      <span class="t-caption" style="font-weight:600; color:var(--c-text);">최소 답변 글자 수</span>
      <span style="display:flex; align-items:center; gap:6px;">
        <input class="input" id="uq-min-${t}-${i}" type="number" min="0" max="2000" step="10" inputmode="numeric"
          style="width:92px; height:36px; text-align:right; padding:0 10px;"
          value="${min}" oninput="qeMin('${t}',${i},this)">
        <span class="t-caption">자</span>
      </span>
    </div>
    <div class="chip-row" id="uq-chips-${t}-${i}" style="margin-bottom:4px;">
      ${[0,50,100,200,300].map(v=>`<button class="chip ${min===v?'active':''}" data-v="${v}" style="padding:5px 12px; font-size:12px;" onclick="qeSetMin('${t}',${i},${v})">${v===0?'제한 없음':v+'자'}</button>`).join('')}
    </div>
    <div class="field-hint">0이면 글자 수 제한이 없어요. 1자 이상으로 정하면 학생은 그 글자 수를 채워야 답변을 제출할 수 있어요.</div>`;
}
function qeChoiceHTML(t, q, i){
  const opts = q.options || [];
  return `
    <div class="t-caption" style="font-weight:600; color:var(--c-text); margin-bottom:6px;">보기 (${MIN_CHOICES}~${MAX_CHOICES}개)</div>
    <div class="stack" style="margin-bottom:8px;">
      ${opts.map((o,j)=>`
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn-icon" title="${q.answer===j?'정답으로 정해져 있어요':'이 보기를 정답으로'}"
          style="flex:0 0 auto; color:${q.answer===j?'var(--c-success)':'var(--c-text-3)'};"
          onclick="qeAnswer('${t}',${i},${j})">${q.answer===j?Icon.check:'○'}</button>
        <input class="input" style="flex:1; height:38px;" placeholder="${j+1}번 보기"
          value="${esc(o||'')}" oninput="qeOptInput('${t}',${i},${j},this)">
        ${opts.length>MIN_CHOICES ? `<button class="btn-icon" style="flex:0 0 auto;" title="이 보기 빼기" onclick="qeDelOpt('${t}',${i},${j})">${Icon.x}</button>`:''}
      </div>`).join('')}
    </div>
    ${opts.length<MAX_CHOICES ? `<button class="btn btn-outline btn-sm" onclick="qeAddOpt('${t}',${i})">+ 보기 추가</button>`:''}
    <div class="field-hint" style="margin-top:6px;">동그라미를 눌러 정답을 정할 수 있어요.
      정답을 정하면 학생 답변을 볼 때 맞았는지 함께 표시돼요. 정하지 않아도 됩니다.</div>`;
}
function qeEditorHTML(t){

  return `

/* ---------- 편집기 조작 ---------- */
function qeInput(t,i,el){ qeList(t)[i].prompt = el.value; }
function qeMin(t,i,el){
  const q = qeList(t)[i]; q.min = clampMin(el.value);
  $all(`#uq-chips-${t}-${i} .chip`).forEach(c=>c.classList.toggle('active', Number(c.dataset.v)===q.min));
}
function qeSetMin(t,i,v){
  const q = qeList(t)[i]; q.min = clampMin(v);
  const box = $(`#uq-min-${t}-${i}`); if(box) box.value = q.min;
  $all(`#uq-chips-${t}-${i} .chip`).forEach(c=>c.classList.toggle('active', Number(c.dataset.v)===q.min));
}
function qeKind(t,i,kind){
  const q = qeList(t)[i];
  if(q.kind===kind) return;
  q.kind = kind;
  if(kind==='choice'){
    if(!Array.isArray(q.options) || q.options.length<MIN_CHOICES) q.options = ['','','',''];
    q.min = 0;
  }
  renderKeepScroll();
}
function qeOptInput(t,i,j,el){ qeList(t)[i].options[j] = el.value; }
function qeAddOpt(t,i){
  const q = qeList(t)[i];
  if(q.options.length>=MAX_CHOICES){ toast(`보기는 ${MAX_CHOICES}개까지 만들 수 있어요.`); return; }
  q.options.push(''); renderKeepScroll();
}
function qeDelOpt(t,i,j){
  const q = qeList(t)[i];
  if(q.options.length<=MIN_CHOICES){ toast(`보기는 ${MIN_CHOICES}개 이상 있어야 해요.`); return; }
  q.options.splice(j,1);
  if(q.answer===j) q.answer = -1;
  else if(q.answer>j) q.answer -= 1;
  renderKeepScroll();
}
function qeAnswer(t,i,j){
  const q = qeList(t)[i];
  q.answer = (q.answer===j) ? -1 : j;   // 한 번 더 누르면 정답 해제
  renderKeepScroll();
}
function qeAdd(t){
  const list = qeList(t);
  if(list.length>=10){ toast('질문은 10개까지 만들 수 있어요.'); return; }
  list.push(blankUQ()); renderKeepScroll();
}
function qeDel(t,i){ qeList(t).splice(i,1); renderKeepScroll(); }

// 화면을 다시 그리되, 시트가 열려 있으면 시트를 다시 그립니다.
function renderKeepScroll(){
  if(state.editMaterialId!=null && $('#ov')) { renderMaterialEditor(); return; }
  render();
}

/* 저장하기 전에 다듬고, 문제가 있으면 안내문을 돌려줍니다. */
function qeNormalize(t){
  const out = [];
  const list = qeList(t);
  for(let i=0;i<list.length;i++){
    const q = list[i];
    const prompt = (q.prompt||'').trim();
    if(!prompt) continue;                       // 비운 질문은 그냥 넘어갑니다
    if(q.kind==='choice'){
      const opts = (q.options||[]).map(o=>(o||'').trim()).filter(o=>o.length>0);
      if(opts.length<MIN_CHOICES){
        return { error:`${i+1}번 질문의 보기를 ${MIN_CHOICES}개 이상 적어주세요.` };
      }
      if(new Set(opts).size !== opts.length){
        return { error:`${i+1}번 질문에 똑같은 보기가 있어요.` };
      }
      // 보기를 지우면서 정답 번호가 밀릴 수 있으니 글자로 다시 찾습니다.
      const picked = (q.answer>=0 && q.options[q.answer]) ? (q.options[q.answer]||'').trim() : '';
      const ans = picked ? opts.indexOf(picked) : -1;
      out.push({ id:q.id ?? null, prompt, kind:'choice', min:0, options:opts, answer:ans>=0?ans:null });
    } else {
      out.push({ id:q.id ?? null, prompt, kind:'text', min:clampMin(q.min), options:[], answer:null });
    }
  }
  return { list: out };
}

// 자료 한 개의 질문을 편집기가 쓰는 모양으로 모읍니다.
function materialQuestionsOf(m){
  const prompts = m.questions || [];
  return prompts.map((p,i)=>({
    id:    (m.questionIds||[])[i] ?? null,
    prompt: p,
    min:    (m.questionMins||[])[i] || 0,
    kind:   (m.questionKinds||[])[i] || 'text',
    options:(m.questionOptions||[])[i] || [],
    answer: (m.questionAnswers||[])[i],
  }));
}

function onEditImagePick(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){ toast('이미지 파일만 올릴 수 있어요.'); return; }
  if(f.size > 5*1024*1024){ toast('이미지 용량이 너무 커요. (5MB 이하)'); return; }
  state.editImageFile = f; state.editImageName = f.name; state.editImageAction = 'replace';
  renderMaterialEditor();
}
function askRemoveEditImage(){
  state.editImageAction = 'remove'; state.editImageFile = null; state.editImageName = '';
  renderMaterialEditor();
}
function cancelEditImage(){
  state.editImageAction = 'keep'; state.editImageFile = null; state.editImageName = '';
  renderMaterialEditor();
}
function closeMaterialEditor(){
  state.editMaterialId=null;
  state.editImageAction='keep'; state.editImageFile=null; state.editImageName='';
  closeModal(); render();

// 미리보기용 (배포본은 qlab-app.js 가 덮어씁니다)
function saveMaterialEdit(){
  const m = tData().materials.find(x=>String(x.id)===String(state.editMaterialId));
  if(!m) return;
  const title = (state.editTitle||'').trim();
  if(!title){ toast('제목을 입력해주세요.'); return; }
  const r = qeNormalize('edit');
  if(r.error){ toast(r.error); return; }
  m.title = title;
  m.desc = (state.editDesc||'').trim() || '설명이 없습니다.';
  m.link = (state.editLink||'').trim() || undefined;
  m.questions = r.list.map(q=>q.prompt);
  m.questionMins = r.list.map(q=>q.min);
  m.questionKinds = r.list.map(q=>q.kind);
  m.questionOptions = r.list.map(q=>q.options);
  m.questionAnswers = r.list.map(q=>q.answer);
  if(state.editImageAction==='remove'){ m.storagePath = null; m.src = undefined; }
  closeMaterialEditor();
  toast('자료를 고쳤어요.');
}

  d[k] = topicList(kind).filter(t=>String(t.id)!==String(tid));

}
function openAssignQuestions(kind, tid){
  const topics = topicList(kind);
  const t = topics.find(x=>String(x.id)===String(tid));
  const pool = approvedPool(kind);
  if(!t) return;
  if(!pool.length){
    openCenterModal(`<div class="sheet-title">넣을 질문이 없어요</div>
      <p class="t-body" style="margin:10px 0 18px;">먼저 [학생 모니터링]에서 학생의 질문을 ${kind==='explore'?'탐구용':'토론용'}으로 승인해주세요.</p>
      <button class="btn btn-primary btn-block" onclick="closeModal()">확인</button>`);
    return;
  }
  openSheet(`
    <div class="sheet-title">'${esc(t.title)}'에 넣을 질문 고르기</div>
    <p class="t-caption" style="margin-bottom:14px;">${kind==='explore'?'탐구용':'토론용'}으로 승인한 질문만 보여요. 한 질문을 <b>여러 주제에 함께</b> 넣을 수 있어요.</p>
    <div class="stack">
      ${pool.map(q=>{
        const mine = (t.questionIds||[]).some(id=>String(id)===String(q.id));
        const others = topics.filter(x=>String(x.id)!==String(tid)
          && (x.questionIds||[]).some(id=>String(id)===String(q.id))).map(x=>x.title);
        return `
        <div class="list-item" style="cursor:pointer;" onclick="toggleAssignQuestion('${kind}','${tid}',${q.id})">
          <div style="flex:1; min-width:0;">
            <div class="t-body" style="margin-bottom:4px;">${esc(q.question)}</div>
            <div class="t-caption">${esc(nameWithNumber(q.author))}${others.length?` · 다른 주제에도 있음: ${esc(others.join(', '))}`:''}</div>
          </div>
          <span class="badge ${mine?'badge-approved':'badge-closed'}">${mine?Icon.check+' 넣음':'넣기'}</span>
        </div>`;
      }).join('')}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="closeModal(); render();">완료</button>
  `);
}
function toggleAssignQuestion(kind, tid, qid){
  const t = topicList(kind).find(x=>String(x.id)===String(tid));
  if(!t) return;
  t.questionIds = t.questionIds || [];
  const at = t.questionIds.findIndex(id=>String(id)===String(qid));
  if(at>-1) t.questionIds.splice(at,1);
  else t.questionIds.push(qid);
  openAssignQuestions(kind, tid);
}
function unassignQuestion(kind, tid, qid){
  const t = topicList(kind).find(x=>String(x.id)===String(tid));
  if(!t) return;
  t.questionIds = (t.questionIds||[]).filter(id=>String(id)!==String(qid));
  render(); toast('주제에서 뺐어요.');
}
// 승인이 취소된 질문은 주제에서도 자동으로 빠지게 한다.
function pruneTopics(){
  ['explore','discuss'].forEach(kind=>{
    const ok = new Set(approvedPool(kind).map(q=>String(q.id)));
    topicList(kind).forEach(t=>{ t.questionIds = (t.questionIds||[]).filter(id=>ok.has(String(id))); });
  });
}

// [수정] 을 눌러야 고를 수 있고, [저장] 을 눌러야 반영됩니다.
function startEditQuestionTypes(){
  const r = tRound(); if(!r) return;
  state.qtypeEditRound = r.id;
  state.qtypeDraft = activeStep2Types(tData(), r).map(t=>t.k);
  render();
}
function cancelEditQuestionTypes(){
  state.qtypeEditRound = null; state.qtypeDraft = null;
  render(); toast('수정을 취소했어요.');
}
function toggleQuestionType(k){
  const cur = state.qtypeDraft || [];
  const next = cur.includes(k) ? cur.filter(x=>x!==k) : [...cur, k];
  if(!next.length){ toast('질문 유형은 최소 한 가지를 골라야 해요.'); return; }
  state.qtypeDraft = STEP2_TYPES.map(t=>t.k).filter(x=>next.includes(x));
  render();
}
// 미리보기용 (배포본은 qlab-app.js 가 덮어씁니다)
function saveQuestionTypes(){
  const r = tRound(); if(!r) return;
  const list = state.qtypeDraft || [];
  if(!list.length){ toast('질문 유형은 최소 한 가지를 골라야 해요.'); return; }
  r.questionTypes = list;
  state.qtypeEditRound = null; state.qtypeDraft = null;
  render(); toast(`${r.label} 질문 유형을 저장했어요.`);
}
