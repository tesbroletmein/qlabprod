function openMaterialAnswers(id){
  const m = tData().materials.find(x=>x.id===id);
  const questions = m.questions || [];
  const answers = (m.answers||[]).filter(a=>a.list.some(x=>x&&x.trim()));
  const students = tData().students.filter(s=>s.status==='approved');
  const notYet = students.filter(s=>!answers.some(a=>a.number===s.number));

  const body = questions.map((q,i)=>{
    const rows = answers.filter(a=>a.list[i] && a.list[i].trim());
    const min = qMin(m,i);
    const choice = qKind(m,i)==='choice';
    const opts = qOptions(m,i);
    const ansIdx = qAnswerIdx(m,i);

    // 객관식이면 보기마다 몇 명이 골랐는지 먼저 보여 줍니다.
    const tally = choice ? `
      <div class="stack" style="margin-bottom:8px;">
        ${opts.map((o,j)=>{
          const cnt = rows.filter(a=>(a.list[i]||'').trim()===o).length;
          const pct = rows.length ? Math.round(cnt/rows.length*100) : 0;
          const right = j===ansIdx;
          return `
          <div style="border:1px solid ${right?'var(--c-success)':'var(--c-border)'}; border-radius:var(--radius-sm); padding:8px 10px;">
            <div class="row-between" style="gap:8px;">
              <span class="t-caption" style="color:var(--c-text); flex:1; min-width:0;">
                ${right?`<b style="color:var(--c-success);">${Icon.check} 정답</b> · `:''}${esc(o)}
              </span>
              <span class="t-caption" style="flex:0 0 auto; font-weight:700;">${cnt}명 (${pct}%)</span>
            </div>
            <div style="height:6px; border-radius:3px; background:var(--c-neutral-bg); margin-top:6px; overflow:hidden;">
              <div style="height:100%; width:${pct}%; background:${right?'var(--c-success)':'var(--c-primary)'};"></div>
            </div>
          </div>`;
        }).join('')}
      </div>` : '';

    return `
    <div class="card" style="margin-bottom:12px;">
      <div class="row-between" style="align-items:flex-start; gap:8px; margin-bottom:8px;">
        <div class="t-caption" style="color:var(--c-text); font-weight:700; flex:1; min-width:0;">Q${i+1}. ${esc(q)}</div>
        ${choice ? `<span class="badge badge-closed" style="flex:0 0 auto;">객관식</span>`
                 : (min>0 ? `<span class="badge badge-active" style="flex:0 0 auto;">최소 ${min}자</span>` : '')}
      </div>
      ${tally}
      ${rows.length ? rows.map(a=>{
        const v = (a.list[i]||'').trim();
        const right = choice && ansIdx>=0 && v===opts[ansIdx];
        const wrong = choice && ansIdx>=0 && !right;
        return `
        <div style="padding:10px 0; border-top:1px solid var(--c-border);">
          <div class="t-caption" style="font-weight:700; color:var(--c-text); margin-bottom:2px;">${esc(a.who)} (${esc(a.number)}) <span style="font-weight:400; color:var(--c-text-3);">· ${esc(a.at)}</span></div>
          <div class="t-caption">${right?`<span style="color:var(--c-success);">${Icon.check} </span>`:''}${wrong?`<span style="color:var(--c-danger);">${Icon.x} </span>`:''}${esc(v)}</div>
        </div>`;
      }).join('')
        : `<div class="t-caption" style="color:var(--c-text-3);">아직 답변이 없어요.</div>`}
    </div>`;
  }).join('');

  openSheet(`
    <div class="sheet-title">${esc(m.title)}</div>
    <p class="t-caption" style="margin-bottom:14px;">답변 제출 ${answers.length}명 / 승인 학생 ${students.length}명</p>
    ${body}
    ${notYet.length ? `
      <div class="card" style="background:var(--c-warning-bg); border:none;">
        <div class="t-caption" style="font-weight:700; color:var(--c-warning); margin-bottom:6px;">${Icon.clock} 미제출 ${notYet.length}명</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          ${notYet.map(s=>`<span class="chip" style="cursor:default; padding:5px 10px; font-size:12px;">${esc(s.nickname||'(미설정)')} (${esc(s.number)})</span>`).join('')}
        </div>
      </div>` : ''}
  `);
}

/* ---------- 글쓰기 열기 / 닫기 ----------
   '글쓰기 이탈 경고' 는 이탈을 세는 기능이자, [글쓰기] 탭의 자물쇠입니다.
   켜야 학생이 글을 쓸 수 있고, 켜는 순간 그 전에 써 둔 글은 모두 지워집니다.
   (경고를 켜기 전에 미리 써 둔 글로 이탈 기록을 피하는 것을 막기 위해서입니다)
------------------------------------------- */
// 이미 써 둔 글이 있는 학생 수
// 한 학생의 '이 차시' 글쓰기 자료. 없으면 빈 값을 돌려줍니다.
//   (차시가 생기기 전에 쌓인 자료는 첫 차시의 것으로 봅니다)
function studentRoundEssay(s, rid){
  if(!rid) return s;
  if(s.byRound && s.byRound[rid]) return s.byRound[rid];
  const first = (roundsOf(tData())[0]||{}).id;
  if(rid === first) return s;
  return { essaySubmitted:false, essayPreview:'', essaySteps:[] };
}
function studentRoundEssaySlot(s, rid){
  if(!rid) return s;
  const first = (roundsOf(tData())[0]||{}).id;
  if(rid === first && !(s.byRound && s.byRound[rid])) return s;
  s.byRound = s.byRound || {};
  s.byRound[rid] = s.byRound[rid] || { essaySubmitted:false, essayPreview:'', essaySteps:['','','','',''] };
  return s.byRound[rid];
}
// 이 차시에 이미 글을 써 둔 학생 수
function essayWrittenCount(d, rid){
  return (d.students||[]).filter(s=>{
    const e = studentRoundEssay(s, rid);
    return e.essaySubmitted || (e.essayPreview||'').trim() || (e.essaySteps||[]).some(v=>v && v.trim());
  }).length;
}
// 이 차시의 글만 지웁니다. 다른 차시의 글은 그대로 둡니다.
function clearSessionEssays(d, rid){
  (d.students||[]).forEach(s=>{
    const e = studentRoundEssaySlot(s, rid);
    e.essaySubmitted = false;
    e.essayPreview   = '';
    e.essaySteps     = ['','','','',''];
    if(e === s){ s.essayLeaveTotal = 0; s.essayLeaveLog = []; }
  });
}
// 내가 학생으로 쓰던 글도 함께 지웁니다 (미리보기에서 교사·학생을 오갈 때)
function resetMyEssay(){
  state.essayText = '';
  state.essaySteps = ['','','','',''];
  state.essayLastGen = ['','','','',''];
  state.essayTouched = false;
  state.essaySubmitted = false;
  state.essayLeaveTotal = 0;
  state.essayLeaveLog = [];
  state.essayEngaged = false;
  state.focusMode = false;       // 집중 모드도 처음 상태로 되돌립니다
  state.focusUsed = false;
  state.essayRounds = {};        // 차시별로 써 둔 글도 함께 비웁니다
}
function toggleEssayDetect(){
  const d = tData();
  const r = tRound();
  if(!r) return;
  if(roundEssayOpen(d, r)){ applyEssayDetect(false); return; }
  const n = essayWrittenCount(d, r.id);
  openCenterModal(`
    <div class="sheet-title">${esc(r.label)} 글쓰기를 열까요?</div>
    <p class="t-body" style="margin:10px 0 12px;">켜면 학생들이 <b>${esc(r.label)}</b>의 [글쓰기] 탭에서
      글을 쓸 수 있게 되고, 이때부터 화면을 벗어나면 횟수가 기록됩니다.
      다른 차시는 그대로예요.</p>
    <div class="card" style="background:var(--c-danger-bg); border:none; padding:12px 14px; margin-bottom:16px;">
      <div class="t-caption" style="font-weight:700; color:var(--c-danger);">${Icon.alert} 켜기 전에 써 둔 글은 모두 지워집니다</div>
      <div class="t-caption" style="margin-top:2px;">${n>0
        ? `이 차시에 써 둔 <b>${n}명</b>의 글과 단계별 기록이 지워져요. 되돌릴 수 없어요.`
        : '이 차시에는 지워질 글이 없어요.'}</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline btn-block" onclick="closeModal()">취소</button>
      <button class="btn btn-danger btn-block" onclick="closeModal(); applyEssayDetect(true);">켜고 초기화</button>
    </div>`);
}
function applyEssayDetect(on){
  const d = tData();
  const r = tRound();
  if(!r) return;
  if(on){
    clearSessionEssays(d, r.id);
    if(state.sSessionId === state.tSessionId){
      // 미리보기에서 교사·학생을 오갈 때, 내가 쓰던 이 차시의 글도 함께 비웁니다.
      delete state.essayRounds[r.id];
      if(state.essayRoundId === r.id) applyEssay(essayBlank());
    }
  }
  r.essayOpen = on;
  render();
  toast(on ? `${r.label} 글쓰기를 열었어요. 이 차시에 쓴 글은 초기화됐어요.`
           : `${r.label} 글쓰기를 닫았어요. 학생은 이 차시의 글을 쓸 수 없어요.`);
}

    ${rid ? `지금은 <b>${esc(label)}</b>의 질문과 글쓰기만 보고 있어요.` : ''}</p>

/* ---------- 승인 대기 알림 ----------
   새로 들어온 학생은 승인하기 전까지 학급의 어떤 자료도 볼 수 없습니다.
   그래서 목록 맨 위에 눈에 띄게 띄우고, 여기서 바로 승인할 수 있게 합니다.
   (지난 학기에 승인했던 학생도, 새 학급에서는 다시 승인해야 합니다) */
function pendingCard(){
  const waiting = (tData().students||[]).filter(s=>s.status==='pending');
  if(!waiting.length) return '';
  return `
  <div class="card" style="margin-bottom:14px; border:1.5px solid var(--c-warning); background:var(--c-warning-bg);">
    <div class="row-between" style="margin-bottom:4px;">
      <span class="t-body-md" style="color:var(--c-warning);">${Icon.clock} 승인을 기다리는 학생 ${waiting.length}명</span>
    </div>
    <p class="t-caption" style="margin-bottom:12px;">승인해야 이 학급의 자료와 질문을 볼 수 있어요.
      본인이 맞는지 확인한 뒤 승인해주세요.</p>
    <div class="stack">
      ${waiting.map(s=>`
      <div class="row-between" style="gap:8px; background:var(--c-surface); border-radius:var(--radius-sm); padding:10px 12px;">
        <div style="flex:1; min-width:0;">
          <div class="t-body-md">${esc(s.nickname||'(미설정)')}</div>
          <div class="t-caption">${esc(s.number)}</div>
        </div>
        <span style="display:flex; gap:6px; flex:0 0 auto;">
          <button class="btn btn-secondary btn-sm" onclick="approveStudent(${s.id})">${Icon.check} 승인</button>
          <button class="btn btn-outline btn-sm" onclick="rejectStudent(${s.id})">반려</button>

  </div>`;
}

}
function lockoutCard(){

function unlockStudent(number){
  state.lockouts = (state.lockouts||[]).filter(l=>l.studentNumber!==number);
  render();
  toast('잠금을 풀었어요. 다시 로그인할 수 있어요.');
}

function miniStat(label, done, value){
  return `<span class="badge ${done?'badge-approved':'badge-closed'}" style="font-size:10px;">${done?Icon.check:''} ${label} ${value}</span>`;
}

// 학생 한 명의 다섯 가지 활동 상황을 한 곳에서 계산한다.
//  rid 를 넘기면 '그 차시' 의 질문·글쓰기만 셉니다. (null 이면 전체 합계)
function studentActivity(s, rid){
  const d = tData();
  const rLabel = rid ? roundLabel(d, rid) : null;
  // (1) 자료 탐색: 선생님 자료의 질문에 답변했는지
  const teacherMats = (d.materials||[]).filter(m=>m.owner!=='student' && (m.questions||[]).length);
  const answeredMats = teacherMats.filter(m=>(m.answers||[]).some(a=>a.number===s.number && a.list.some(x=>x&&x.trim())));
  // (2) 질문 만들기: 이 학생이 공유한 질문
  let myQuestions = (d.shared||[]).filter(q=>q.author===s.nickname);
  if(rLabel) myQuestions = myQuestions.filter(q=>q.round === rLabel);
  const approvedCount = myQuestions.filter(q=>q.approvedForExplore||q.approvedForDiscussion).length;
  // (3) 탐구하기: 이 학생이 올린 자료
  const myMaterials = (d.materials||[]).filter(m=>m.owner==='student' && m.byNumber===s.number);
  // (4) AI 토론
  const discussionCount = s.discussionCount || 0;
  // (5) 글쓰기 : 차시를 고르면 그 차시의 글만 봅니다
  const roundEssay = rid ? studentRoundEssay(s, rid) : s;
  return {
    teacherMats, answeredMats,
    answerDone: teacherMats.length>0 && answeredMats.length===teacherMats.length,
    answerLabel: `${answeredMats.length}/${teacherMats.length}`,
    myQuestions, approvedCount,
    questionDone: myQuestions.length>0,
    questionLabel: `${myQuestions.length}개`,
    myMaterials,
    exploreDone: myMaterials.length>0,
    exploreLabel: `${myMaterials.length}개`,
    discussionCount,
    discussDone: discussionCount>0,
    discussLabel: `${discussionCount}회`,
    essayDone: !!roundEssay.essaySubmitted,
    essayLabel: roundEssay.essaySubmitted ? '제출' : '미제출',
    roundEssay,
  };
}

// 제출 기록.
//   글자 수가 거의 그대로인데 여러 번 냈다면, 고쳤다기보다
//   집중 모드에서 빠져나오려고 누른 쪽에 가깝습니다.
//   숫자를 그대로 보여 주고 판단은 선생님이 하시도록 둡니다.
function submitLogHTML(s){
  const log = Array.isArray(s.essaySubmitLog) ? s.essaySubmitLog : [];
  const n = s.essaySubmitCount || 0;
  if(!n) return '';
  const rows = log.map((r,i)=>{
    const prev = i>0 ? (log[i-1].chars||0) : null;
    const diff = prev===null ? '' : (r.chars-prev>=0 ? `+${r.chars-prev}자` : `${r.chars-prev}자`);
    const same = prev!==null && r.chars===prev;
    return `<li class="t-caption" style="display:flex; gap:8px;">
      <b style="color:var(--c-primary); flex:0 0 auto;">${i+1}차</b>
      <span style="flex:1; min-width:0;">${esc(r.at||'')} · ${r.chars||0}자
        ${diff ? `<span style="color:${same?'var(--c-warning)':'var(--c-text-3)'};">(${same?'변화 없음':diff})</span>` : ''}</span>
    </li>`;
  }).join('');
  return `<div class="divider"></div>
    <div class="t-caption" style="font-weight:600; margin-bottom:4px;">제출 기록 (${n}회)</div>
    ${rows ? `<ul class="stack" style="margin:0; padding:0; list-style:none;">${rows}</ul>`
           : `<div class="t-caption" style="color:var(--c-text-3);">이 기능을 넣기 전에 낸 글이라 자세한 기록이 없어요.</div>`}
    ${n>1 ? `<div class="t-caption" style="margin-top:6px; color:var(--c-text-3);">글자 수가 거의 그대로인데 여러 번 냈다면, 글을 고치려던 것인지 확인해 보세요.</div>` : ''}`;
}

/* =========================================================
   내보내기 — 학생 활동 요약 + 브레인스토밍 질문 기록 + (선택) 생기부 초안
========================================================= */
function csvCell(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
function toCsv(rows){ return rows.map(r=>r.map(csvCell).join(',')).join('\r\n'); }
function downloadCsv(name, text){
  const blob = new Blob(['\uFEFF'+text], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}
// ① 학생 활동 요약
function buildStudentRows(){
  const d = tData();
  const head = ['고유 번호','별명','상태','최종 탐구 질문','공유 질문 수','승인된 질문 수',
    '자료 질문 답변(자료 수)','제출한 자료 수','AI 토론 대화 수','글쓰기 제출','제출 횟수','이탈 횟수','선생님 피드백'];
  const rows = (d.students||[]).map(s=>{
    const p = studentActivity(s);
    return [s.number, s.nickname, s.status, s.finalQuestion||'',
      p.myQuestions.length, p.approvedCount, p.answerLabel, p.myMaterials.length,
      p.discussionCount, s.essaySubmitted?'제출':'미제출', s.essaySubmitCount||0, s.essayLeaveTotal||0, s.feedback||''];
  });
  return [head, ...rows];
}
// ② 브레인스토밍: 누가 어떤 질문을 언제 입력했는지
function buildQuestionRows(){
  const d = tData();
  const head = ['입력 시각','고유 번호','별명','질문'];
  const log = [];
  (d.words||[]).forEach(q=>(q.by||[]).forEach(e=>{
    log.push([e.at||'-', numberOf(e.who)||'-', e.who, q.t]);
  }));
  log.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
  return [head, ...log];
}
// ③ 생기부 특기사항 초안
function buildRecordRows(){
  const d = tData();
  const head = ['고유 번호','별명','바이트 수','생기부 특기사항 초안'];
  const rows = (d.students||[])
    .filter(s=>s.recordDraft && s.recordDraft.trim())
    .map(s=>[s.number, s.nickname, countBytes(s.recordDraft), s.recordDraft]);
  return [head, ...rows];
}
function exportSections(){
  const out = [{ key:'students', label:'학생 활동 요약', rows: buildStudentRows() }];
  out.push({ key:'questions', label:'브레인스토밍 질문 기록', rows: buildQuestionRows() });   // 항상 포함
  if(state.exportRecords!==false) out.push({ key:'records', label:'생기부 특기사항 초안', rows: buildRecordRows() });
  return out;
}
function exportAllCsv(){
  const meta = tSession();
  const base = `질문연구소_${(meta&&meta.className)||'학급'}`;
  const parts = exportSections();
  // 한 파일에 구역을 나눠 담아, 엑셀에서 열었을 때 표가 순서대로 보이게 한다.
  const blocks = parts.map(p=>{
    const dataRows = p.rows.length-1;
    return `[${p.label}] (${dataRows}건)\r\n` + toCsv(p.rows);
  });
  downloadCsv(`${base}.csv`, blocks.join('\r\n\r\n'));
  const names = parts.map(p=>p.label).join(' · ');
  toast(`CSV 를 내려받았어요. (${names})`);
}
function syncSheet(){
  const btn = $('#sync-btn');
  if(!btn) return;
  btn.disabled = true; btn.innerHTML = `${Icon.refresh} 동기화 중…`;
  const parts = exportSections();
  setTimeout(()=>{
    const summary = parts.map(p=>`${p.label} ${p.rows.length-1}건`).join(' · ');
    toast(`동기화 완료 — ${summary}`);
    render();
  }, 1100);
}

function openRecordDraft(id){
  state.recordTarget = id;
  const s = tData().students.find(x=>x.id===id);
  state.recordPhase = s.recordDraft ? 'done' : 'idle';
  renderRecordSheet();
}
function renderRecordSheet(){
  const s = tData().students.find(x=>x.id===state.recordTarget);
  const basis = collectStudentEvidence(s);
  let body;
  if(state.recordPhase==='idle'){
    body = `
      <div class="card" style="margin-bottom:14px; background:var(--c-neutral-bg); border:none;">
        <div class="t-caption" style="font-weight:700; color:var(--c-text); margin-bottom:6px;">${Icon.doc} 근거로 사용할 실제 기록</div>
        ${recordEvidenceHTML(basis)}
      </div>
      <p class="t-caption" style="margin-bottom:14px;">위 기록만 근거로 삼아 특기사항 초안(약 1500바이트)을 만들어요. 인공지능은 실제로 하지 않은 활동을 지어내지 않아요.</p>
      <button class="btn btn-primary btn-block" onclick="generateRecordDraft(${s.id})">${Icon.spark} AI로 초안 생성하기</button>`;
  } else if(state.recordPhase==='loading'){
    body = `<div class="skeleton sk-row"></div><div class="skeleton sk-row"></div><div class="t-caption" style="text-align:center;">초안을 작성하고 있어요…</div>`;
  } else if(state.recordPhase==='error'){
    body = `<div class="state-block error"><div class="state-icon">${Icon.alert}</div><div class="state-desc">초안 생성에 실패했어요. 다시 시도해주세요.</div><button class="btn btn-primary" onclick="generateRecordDraft(${s.id})">다시 시도</button></div>`;
  } else if(state.recordPhase==='insufficient'){
    body = `
      <div class="state-block" style="padding:20px 4px;">
        <div class="state-icon">${Icon.alert}</div>
        <div class="state-title">관찰된 활동 기록이 부족해요</div>
        <div class="state-desc">탐구 질문, AI 토론, 글쓰기 중 확인할 수 있는 기록이 거의 없어서, 실제 근거 없이 초안을 지어내지 않도록 자동 생성을 하지 않았어요. 학생이 활동을 더 진행하거나, 아래 칸에 선생님이 직접 관찰한 내용을 입력해주세요.</div>
      </div>
      <div class="field"><label>직접 작성 (선생님 관찰 기반)</label><textarea class="textarea" id="record-text" style="min-height:160px;" placeholder="직접 관찰한 내용을 바탕으로 작성해주세요.">${esc(s.recordDraft||'')}</textarea></div>
      <button class="btn btn-primary btn-block" onclick="saveRecordDraft(${s.id})">저장하기</button>`;
  } else {
    body = `
      <div class="row-between" style="margin-bottom:6px;">
        <span class="t-caption" style="font-weight:600;">근거 기반 초안</span>
        <span class="t-caption" id="record-bytes">${countBytes(s.recordDraft||'')}바이트 / 1500바이트</span>
      </div>
      <textarea class="textarea" id="record-text" style="min-height:180px;" oninput="onRecordTextInput()">${esc(s.recordDraft)}</textarea>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn btn-outline btn-block" onclick="generateRecordDraft(${s.id})">${Icon.refresh} 다시 생성</button>
        <button class="btn btn-primary btn-block" onclick="saveRecordDraft(${s.id})">저장하기</button>
      </div>`;
  }
  openSheet(`<div class="sheet-title">${esc(s.nickname)} <span class="t-caption" style="font-weight:500;">${s.number}</span> 특기사항 초안</div>${body}`);
}
function onRecordTextInput(){
  const el = $('#record-text'); const bytesEl = $('#record-bytes');
  if(el && bytesEl) bytesEl.textContent = countBytes(el.value)+'바이트 / 1500바이트';
}

function collectStudentEvidence(s){
  return {
    finalQuestion: s.finalQuestion || null,
    words: Array.isArray(s.words) ? s.words : [],
    materialAnswers: (s.answerCount||0)>0 ? [{title:'자료 질문 답변', count:s.answerCount}] : [],
    discussionCount: s.discussionCount || 0,
    essayStepCount: (s.essaySteps||[]).filter(v=>v&&v.trim()).length,
    essaySubmitted: !!s.essaySubmitted,
    essayPreview: s.essayPreview || ''
  };
}
function recordEvidenceHTML(b){
  const rows = [];
  rows.push(['최종 탐구 질문', b.finalQuestion ? `'${b.finalQuestion}'` : '없음']);
  rows.push(['브레인스토밍 질문', b.words.length ? b.words.join(' / ') : '없음']);
  rows.push(['자료 질문 답변', b.materialAnswers.length ? b.materialAnswers.map(m=>`${m.title} (${m.count}개)`).join(', ') : '없음']);
  rows.push(['AI 토론 참여', b.discussionCount>0 ? `${b.discussionCount}개 대화` : '없음']);
  rows.push(['글쓰기', b.essaySubmitted ? `제출됨 (단계 ${b.essayStepCount}/5 작성)` : '미제출']);
  return rows.map(([k,v])=>`<div class="t-caption" style="margin-bottom:4px;"><b style="color:var(--c-text);">${k}:</b> ${esc(v)}</div>`).join('');
}
function countBytes(str){ return new TextEncoder().encode(str||'').length; }
function generateRecordDraft(id){ toast('AI 연결 기능이 준비되지 않았어요.'); }
function saveRecordDraft(id){
